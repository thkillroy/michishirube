<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>通報の対応｜MICHI-SHIRUBE</title>
<style>
:root { color-scheme: dark; }
body { margin:0; background:#08090d; color:#e9e9ee; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; line-height:1.7; }
.wrap { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
h1 { font-size:18px; color:#ff9f1c; margin:0 0 14px; }
.card { background:#12141a; border:1px solid #262b36; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; color:#9a9aa6; font-weight:400; width:7.5em; vertical-align:top; padding:4px 8px 4px 0; }
td { padding:4px 0; word-break:break-word; }
.badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
.open { background:#3a2a00; color:#ffcf6a; } .done { background:#123a1e; color:#7fd18b; }
.act { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; border-radius:10px; border:1px solid #343b48; background:#181b23; color:#e9e9ee; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
.act small { display:block; font-weight:400; font-size:12px; color:#9a9aa6; margin-top:2px; }
.act.warn { border-color:#7a4a00; } .act.danger { border-color:#5a1f1f; color:#ff8a8a; }
.act:disabled { opacity:0.4; cursor:default; }
.msg { font-size:14px; padding:10px 12px; border-radius:8px; margin-bottom:12px; display:none; }
.ok { background:#123a1e; color:#a6f0b4; } .err { background:#3a1212; color:#ffb3b3; }
.note { font-size:12px; color:#7e7e8b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚠ 通報の対応</h1>
  <div id="msg" class="msg"></div>
  <div id="info" class="card">読み込み中…</div>
  <div id="acts" class="card" style="display:none;">
    <div style="font-size:13px;color:#9a9aa6;margin-bottom:4px;">対応を選んでください（押すと確認が出ます）</div>
    <button class="act warn" id="b-hide" onclick="act('hide','通報されたものを非公開にしますか？')">非公開にする<small>通報されたルート・固定ポイントだけを、持ち主以外から見えなくします。持ち主は自分のマイリストで見られます</small></button>
    <button class="act warn" id="b-hide_all" onclick="act('hide_all','この人の公開・フォロワー公開を、全部非公開にしますか？')">持ち主の公開を全部止める<small>その人のルート・固定ポイント・フォルダを全部非公開にします（悪質な時）</small></button>
    <button class="act danger" id="b-ban" onclick="act('ban','この人のアカウントを止めますか？ログインできなくなります')">アカウントを止める<small>その人はログインできなくなります。データは消えません。後で戻せます</small></button>
    <button class="act" id="b-unban" onclick="act('unban','アカウントの停止を戻しますか？')" style="display:none;">アカウントの停止を戻す<small>止めたアカウントを、またログインできるようにします</small></button>
    <button class="act" id="b-done" onclick="act('done','何も変えずに、対応済みにしますか？')">問題なし（対応済みにする）<small>何も変えずに閉じます</small></button>
    <button class="act" id="b-reopen" onclick="act('reopen','未対応に戻しますか？')" style="display:none;">未対応に戻す<small>もう一度確認したい時に</small></button>
  </div>
  <p class="note">このページは、通報のメールのリンクからだけ開けます。リンクは人に転送しないでください。</p>
</div>
<script>
const SUPABASE_URL = 'https://zryfljpzllnkukbitfpl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyeWZsanB6bGxua3VrYml0ZnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTI4NDcsImV4cCI6MjEwNTM4ODg0N30.RySxqFIiVBvwuwujMjODTkrxD3AJWD26yhqJsEojhMI';
const q = new URLSearchParams(location.search);
const ID = q.get('id'), TOKEN = q.get('t');
const TYPE = { user:'利用者', route:'ルート', point:'固定ポイント' };
const REASON = { inappropriate:'不適切な内容', personal:'個人情報が載っている', spam:'迷惑行為・宣伝', impersonation:'なりすまし', other:'その他' };
const VIS = { public:'公開', followers:'フォロワーに公開', private:'非公開' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(name, body){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, { method:'POST',
    headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function show(msg, ok){ const m = document.getElementById('msg'); m.textContent = msg; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.style.display = 'block'; }
function render(d){
  const target = d.target_type === 'user' ? (d.owner_name || '-') : (d.target_exists ? (d.target_name || '（名前なし）') : '（もう削除されています）');
  const shareKind = d.target_type === 'route' ? 'r' : d.target_type === 'point' ? 'p' : null;
  const link = (shareKind && d.target_exists && d.target_visibility !== 'private') ? `<a href="https://thkilroy.com/michishirube/?${shareKind}=${esc(d.target_id)}" target="_blank" rel="noopener" style="color:#ffcf6a;">地図で見る</a>` : '';
  document.getElementById('info').innerHTML = `<table>
    <tr><th>状態</th><td><span class="badge ${d.status}">${d.status === 'done' ? '対応済み' : '未対応'}</span>${d.handled_note ? '<br><span class="note">' + esc(d.handled_note) + '</span>' : ''}</td></tr>
    <tr><th>種類</th><td>${esc(TYPE[d.target_type] || d.target_type)}</td></tr>
    <tr><th>対象</th><td>${esc(target)} ${link}</td></tr>
    ${d.target_type !== 'user' ? `<tr><th>今の公開範囲</th><td>${esc(VIS[d.target_visibility] || '-')}</td></tr>` : ''}
    <tr><th>持ち主</th><td>${esc(d.owner_name || '-')}${d.owner_banned ? ' <span class="badge" style="background:#3a1212;color:#ff9a9a;">停止中</span>' : ''}<br><span class="note">公開・フォロワー公開しているもの：${d.owner_public_count} 件</span></td></tr>
    <tr><th>理由</th><td>${esc(REASON[d.reason] || d.reason)}</td></tr>
    <tr><th>くわしく</th><td>${esc(d.detail || '（なし）')}</td></tr>
    <tr><th>通報した人</th><td>${esc(d.reporter_name || '-')}</td></tr>
    <tr><th>日時</th><td>${esc(new Date(d.created_at).toLocaleString('ja-JP'))}</td></tr>
    <tr><th>同じ対象への通報</th><td>${d.same_target_reports} 件</td></tr>
  </table>`;
  document.getElementById('acts').style.display = 'block';
  const isItem = d.target_type !== 'user';
  document.getElementById('b-hide').style.display = isItem ? '' : 'none';
  document.getElementById('b-hide').disabled = !d.target_exists || d.target_visibility === 'private';
  document.getElementById('b-hide_all').disabled = !d.owner_public_count;
  document.getElementById('b-ban').style.display = d.owner_banned ? 'none' : '';
  document.getElementById('b-unban').style.display = d.owner_banned ? '' : 'none';
  document.getElementById('b-done').style.display = d.status === 'done' ? 'none' : '';
  document.getElementById('b-reopen').style.display = d.status === 'done' ? '' : 'none';
}
async function load(){
  if(!ID || !TOKEN){ document.getElementById('info').textContent = 'リンクが正しくありません。'; return; }
  try{ render(await rpc('report_info', { p_id: ID, p_token: TOKEN })); }
  catch(e){ document.getElementById('info').textContent = '通報が見つかりません（リンクが正しくないか、削除されています）。'; }
}
async function act(action, question){
  if(!confirm(question)) return;
  document.querySelectorAll('.act').forEach(b => b.disabled = true);
  try{
    const d = await rpc('report_action', { p_id: ID, p_token: TOKEN, p_action: action });
    render(d); show('対応しました：' + (d.handled_note || '').split(' / ').pop(), true);
  }catch(e){ show('できませんでした：' + e.message, false); load(); }
}
load();
</script>
</body>
</html>
