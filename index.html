<script>
// Google Mapsの読み込み完了を検知（async読み込みなので、コールバック関数は先に定義しておく必要がある）
window._googleMapsReady = false;
function onGoogleMapsLoaded(){
  window._googleMapsReady = true;
  if(window._onGoogleMapsReadyCallback) window._onGoogleMapsReadyCallback();
}
// 初期言語を先に判定（Google Mapsのタイル言語はscriptタグのlanguageパラメータで一度だけ決まるため）
window._SUPPORTED_LANGS = ['ja','en','zh-CN','zh-TW','ko','es','fr','th','vi','de','ru','pt','ar','it','id'];
window._PLACES_LANG = { ja:'ja', en:'en', 'zh-CN':'zh-CN', 'zh-TW':'zh-TW', ko:'ko', es:'es', fr:'fr', th:'th', vi:'vi', de:'de', ru:'ru', pt:'pt-BR', ar:'ar', it:'it', id:'id' };
function _detectInitialLangEarly(){
  const saved = localStorage.getItem('navi_lang');
  if(saved && window._SUPPORTED_LANGS.includes(saved)) return saved;
  const nav = (navigator.language || 'en');
  const exact = window._SUPPORTED_LANGS.find(l => l.toLowerCase() === nav.toLowerCase());
  if(exact) return exact;
  const base = nav.split('-')[0];
  if(base === 'zh'){ return /TW|HK|MO/i.test(nav) ? 'zh-TW' : 'zh-CN'; }
  const baseMatch = window._SUPPORTED_LANGS.find(l => l.split('-')[0] === base);
  return baseMatch || 'en';
}
window._initialLang = _detectInitialLangEarly();
(function(){
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyAwuYMBSE85I1VMnG34H-E8JzY114YRSYE&libraries=places&loading=async&language=' + (window._PLACES_LANG[window._initialLang] || 'en') + '&callback=onGoogleMapsLoaded';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
})();
</script>

function detectInitialLang(){
  // headで既に判定済み（Google Mapsのlanguageパラメータと一致させるため）
  return window._initialLang || 'en';
}
let currentLang = detectInitialLang();

function t(key, vars){
  let str = (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
  if(vars){
    Object.keys(vars).forEach(k=>{ str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}

function applyStaticTranslations(){
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    el.title = t(el.dataset.i18nTitle);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  // 動的に切り替わるボタン類は個別に再描画
  if(typeof renderList === 'function') renderList();
  const addBtn = document.getElementById('btn-add');
  if(addBtn && addBtn.dataset.state !== 'active'){ addBtn.textContent = t('add_point_btn'); }
  const routeBtn = document.getElementById('btn-route-mode');
  if(routeBtn){ routeBtn.textContent = typeof useRoad!=='undefined' && !useRoad ? t('route_mode_straight') : t('route_mode_road'); }
  const navBtn = document.getElementById('btn-nav');
  if(navBtn && typeof navActive!=='undefined'){ navBtn.textContent = navActive ? t('nav_stop_btn') : t('nav_start_btn'); }
  if(typeof updateUserBar === 'function') updateUserBar();
  if(typeof setMapStyleLabels === 'function') setMapStyleLabels();
  if(typeof updatePanelLabels === 'function') updatePanelLabels();
}

function setLanguage(lang){
  if(!SUPPORTED_LANGS.includes(lang)) return;
  if(lang === currentLang) return;
  if(points.length && !confirm(t('confirm_lang_change_reload'))){
    const sel = document.getElementById('lang-select');
    if(sel) sel.value = currentLang;
    return;
  }
  localStorage.setItem('navi_lang', lang);
  location.reload();
}

function initLangSelector(){
  const sel = document.getElementById('lang-select');
  if(!sel) return;
  sel.innerHTML = SUPPORTED_LANGS.map(l=>`<option value="${l}">${LANG_NAMES[l]}</option>`).join('');
  sel.value = currentLang;
  sel.addEventListener('change', e=>setLanguage(e.target.value));
}

const map = L.map('map', { center:[35.68,139.75], zoom:14, zoomControl:false,
  // 回転：ボタンで切り替える時だけ回す（2本指でのひねり回転・標準の回転ボタンは使わない）
  rotate:true, bearing:0, touchRotate:false, rotateControl:false, shiftKeyRotate:false, compassBearing:false });

// ===== 地図タイル：Googleマップ（失敗/上限到達時はMapTilerにフォールバック） =====
let googleLayer = null;
let usingGoogleMap = false;
let trafficLayerOn = false;
let bicyclingLayerOn = false;
let transitLayerOn = false;
let currentMapType = 'roadmap';

function useMapTilerFallback(){
  if(usingGoogleMap) return;
  L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
    attribution:'© <a href="https://www.maptiler.com/">MapTiler</a> © OpenStreetMap',
    maxZoom:19, tileSize:256
  }).addTo(map);
}

function initGoogleLayer(){
  try{
    const opts = { type: currentMapType };
    const st0 = buildMapStyles();
    if(st0) opts.styles = st0;
    googleLayer = L.gridLayer.googleMutant(opts).addTo(map);
    usingGoogleMap = true;
  }catch(e){
    console.warn('Googleマップ読み込み失敗、MapTilerにフォールバック', e);
    useMapTilerFallback();
  }
}
if(window._googleMapsReady){
  // 後ろで定義される地図スタイル（MAP_BASE_STYLES等）の準備が終わってから実行する
  setTimeout(initGoogleLayer, 0);
} else {
  window._onGoogleMapsReadyCallback = initGoogleLayer;
}
// 4秒待ってGoogleが読み込まれなければMapTilerに切り替え
setTimeout(()=>{ if(!usingGoogleMap) useMapTilerFallback(); }, 4000);

function buildMapStyles(){
  const out = (MAP_BASE_STYLES[currentMapStyle] || []).slice();
  if(mapHidePOI) out.push(...MAP_HIDE_POI);
  if(mapHideLabels) out.push(...MAP_HIDE_LABELS);
  return out.length ? out : null;
}

function rebuildGoogleLayer(){
  if(!usingGoogleMap) return;
  if(googleLayer) map.removeLayer(googleLayer);
  const opts = { type: currentMapType };
  const st = buildMapStyles();
  if(st) opts.styles = st;
  googleLayer = L.gridLayer.googleMutant(opts).addTo(map);
  if(trafficLayerOn) googleLayer.addGoogleLayer('TrafficLayer');
  if(transitLayerOn) googleLayer.addGoogleLayer('TransitLayer');
  if(bicyclingLayerOn) googleLayer.addGoogleLayer('BicyclingLayer');
}

// ===== 方位ボタン：北が上で固定 ⇔ スマホの向きに合わせて地図を回す =====
// ・針は「北」を指す（赤＝北、白＝南）。地図が回ると針も一緒に回る
// ・スマホの向きは方位センサーで取る（PCは向きが取れないので北固定だけ）
const canRotateMap = typeof map.setBearing === 'function';
let compassMode = 'north';      // 'north'＝北が上 / 'heading'＝スマホの向き
let compassEl = null, compassSvg = null;
let headingSmooth = null, headingLastSet = 0;
function mapBearingDeg(){ return (canRotateMap && map.getBearing) ? (map.getBearing() || 0) : 0; }
function updateCompassNeedle(){
  if(compassSvg) compassSvg.style.transform = `rotate(${mapBearingDeg()}deg)`;
  if(compassEl) compassEl.classList.toggle('heading', compassMode === 'heading');
}
// 方位センサーの値 → スマホの上が向いている方角（北から時計回りの度）
function readHeading(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;          // iPhone
  else if(e.absolute === true || e.type === 'deviceorientationabsolute'){
    if(typeof e.alpha === 'number') h = 360 - e.alpha;                                 // Android
  }
  if(h === null) return null;
  const scr = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
  return (h + scr + 360) % 360;
}
function onDeviceHeading(e){
  if(compassMode !== 'heading') return;
  const h = readHeading(e); if(h === null) return;
  // なめらかにする（急なブレを抑える）
  if(headingSmooth === null) headingSmooth = h;
  else { let d = ((h - headingSmooth + 540) % 360) - 180; headingSmooth = (headingSmooth + d * 0.25 + 360) % 360; }
  const now = performance.now();
  if(now - headingLastSet < 80) return;   // 1秒に十数回まで
  headingLastSet = now;
  map.setBearing(-headingSmooth);
  updateCompassNeedle();
}
const ORIENT_EVENT = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
let headingGotValue = false;
async function setCompassMode(mode){
  if(mode === 'heading'){
    if(!canRotateMap || !window.DeviceOrientationEvent){ alert(t('compass_unsupported')); return; }
    // iPhone は許可が必要
    if(typeof DeviceOrientationEvent.requestPermission === 'function'){
      try{ if(await DeviceOrientationEvent.requestPermission() !== 'granted'){ alert(t('compass_permission_denied')); return; } }
      catch(e){ alert(t('compass_permission_denied')); return; }
    }
    compassMode = 'heading'; headingSmooth = null; headingGotValue = false;
    window.addEventListener(ORIENT_EVENT, onDeviceHeadingWrap, true);
    // 2秒たっても向きが取れない端末（PCなど）は北固定に戻す
    setTimeout(()=>{ if(compassMode === 'heading' && !headingGotValue){ setCompassMode('north'); alert(t('compass_unsupported')); } }, 2000);
  } else {
    compassMode = 'north';
    window.removeEventListener(ORIENT_EVENT, onDeviceHeadingWrap, true);
    if(canRotateMap) map.setBearing(0);
  }
  updateCompassNeedle();
}
function onDeviceHeadingWrap(e){ if(readHeading(e) !== null) headingGotValue = true; onDeviceHeading(e); }
if(canRotateMap){
  const CompassControl = L.Control.extend({
    options:{ position:'topright' },
    onAdd(){
      const btn = L.DomUtil.create('button', 'compass-btn');
      btn.type = 'button';
      btn.title = t('compass_title');
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">'
        + '<polygon points="12,2 16,12 8,12" fill="#e53935"/>'
        + '<polygon points="12,22 16,12 8,12" fill="#ffffff" stroke="#9e9e9e" stroke-width="0.8"/>'
        + '<circle cx="12" cy="12" r="1.6" fill="#424242"/></svg>';
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.on(btn, 'click', ()=>setCompassMode(compassMode === 'north' ? 'heading' : 'north'));
      compassEl = btn; compassSvg = btn.querySelector('svg');
      return btn;
    }
  });
  new CompassControl().addTo(map);
  map.on('rotate', updateCompassNeedle);
}

function loadGpsIconForUser(){
  const k = gpsIconKey();
  let d = null;
  try{
    if(k){
      d = localStorage.getItem(k);
      // 以前の「端末だけ」の保存（navi_gps_icon）は、最初にログインした人のものとして引き継ぐ
      const old = localStorage.getItem('navi_gps_icon');

      if(old) localStorage.removeItem('navi_gps_icon');

    gpsIconData = d || null;
    if(typeof rebuildGpsMarker === 'function') rebuildGpsMarker();

function createGpsMarker(lat,lng){
  if(gpsIconData){
    const icon = L.divIcon({
      html:`<img src="${gpsIconData}" style="width:48px;height:48px;object-fit:contain;display:block;">`,
      iconSize:[48,48], iconAnchor:[24,24], className:''
    });
    return L.marker([lat,lng],{icon, interactive:false, zIndexOffset:1000}).addTo(map);
  }
  return L.circleMarker([lat,lng],{radius:9,color:'#2ea8ff',fillColor:'#2ea8ff',fillOpacity:1,weight:3}).addTo(map);
}

// ===== 起動時に現在地へ =====
function startGPS(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(onGPS, onGPSErr, {enableHighAccuracy:true, maximumAge:2000, timeout:10000});
}
function onGPS(pos){
  const{latitude:lat, longitude:lng, accuracy}=pos.coords;
  const b=document.getElementById('gps-badge');
  b.textContent=t('gps_accuracy',{m:Math.round(accuracy)});
  b.className=accuracy<30?'good':accuracy<100?'':'bad';
  // 初回だけ現在地に移動
  if(!gpsInitialized){ setViewVisible([lat,lng],16); gpsInitialized=true; }
  if(!gpsMarker){
    gpsMarker=createGpsMarker(lat,lng);
    gpsCircle=L.circle([lat,lng],{radius:accuracy,color:'#2ea8ff',fillColor:'#2ea8ff',fillOpacity:0.08,weight:1}).addTo(map);
  }else{ gpsMarker.setLatLng([lat,lng]); gpsCircle.setLatLng([lat,lng]).setRadius(accuracy); }
  if(followMode)panToVisible([lat,lng]);
  if(navActive){
    checkProgress(lat,lng);
    // ナビバーの距離をリアルタイム更新
    if(navIndex<points.length){
      const tgt=points[navIndex];
      const d=calcDist(lat,lng,tgt.lat,tgt.lng);
      document.getElementById('nav-dist-next').textContent=t('dist_next_straight',{dist:formatDist(d)});
      // 残り = 現在地→次のポイント(直線) + 次のポイント→ゴール(道路)
      const roadRem=calcRemainingDist(); // 次のポイント以降の道路距離
      const totalRem = roadRem!==null ? d+roadRem : d;
      document.getElementById('nav-dist-goal').textContent=t('dist_remaining',{dist:formatDist(totalRem)});
    }
  }
}
function onGPSErr(){ const b=document.getElementById('gps-badge'); b.textContent=t('gps_error'); b.className='bad'; }

// パネルに隠れないよう、見えている部分の中心に来るように寄せる
// 範囲表示の余白（パネルに隠れる分を足す）
function fitPadTL(base){ const b = base||50; return [b, b]; }
function fitPadBR(base){
  const b = base||50;
  const cs = getComputedStyle(document.documentElement);
  const px = k => parseFloat(cs.getPropertyValue(k)) || 0;
  return [b + px('--panel-w') + px('--edge-w'), b + px('--panel-h') + px('--edge-h')];
}

function panelOffset(){
  const land = isLandscapePanel();
  const cs = getComputedStyle(document.documentElement);
  const px = k => parseFloat(cs.getPropertyValue(k)) || 0;
  return land
    ? { x: -(px('--panel-w') + px('--edge-w')) / 2, y: 0 }
    : { x: 0, y: -(px('--panel-h') + px('--edge-h')) / 2 };
}

// 地図の中心を、見えている部分の中心に合わせて移動する
function panToVisible(latlng, opts){
  const off = panelOffset();
  const pt = map.latLngToContainerPoint(latlng);
  map.panTo(map.containerPointToLatLng([pt.x - off.x, pt.y - off.y]), opts);
}

function setViewVisible(latlng, zoom){
  map.setView(latlng, zoom);
  const off = panelOffset();
  if(off.x || off.y) map.panBy([-off.x, -off.y], {animate:false});
}

// グループ区切りは見た目だけ（用途は固定しない）
const ICON_GROUPS = [
  ['🏨','🍴','🍜','🍣','🥩','🍸','🏮','☕','🍲'],
  ['🌳','🎡','🦁','📚','🌌','🌃','🌅','🌇','♨️','🏞️'],
  ['🏛️','🖼️','🏺','🎻','🏟️'],
  ['⛩️','🏯','🕌'],
  ['🎭','🎷','🎸','🪩','🍾','🎮','🎌'],
  ['🤿','🪂','🛹','🚲','🚗','🏋️'],
  ['⛽','🅿️','🛒','🚓','👗'],
  ['⚠️','🔞','🚬'],
  ['📷'],
  ['⭐','🚩']
];
const ICON_LIST = ICON_GROUPS.flat();
const ICON_COLORS = ['default','#ff4d4d','#ff9f1c','#2fd6a5','#00d5c8','#2ea8ff','#9b7bff','#ff5c8a','#ffffff','#1a1a1f'];
let selectedIcon = '⭐';

// ⭐系なら'star'、🚩系なら'flag'、それ以外はnull
function iconBase(icon){
  if(!icon) return null;
  if(icon==='⭐' || icon.startsWith('star:')) return 'star';
  if(icon==='🚩' || icon.startsWith('flag:')) return 'flag';
  return null;
}
function iconColor(icon){
  const m = /^(?:star|flag):(#[0-9a-fA-F]{6})$/.exec(icon||'');
  return m ? m[1] : 'default';
}
// アイコンを表示用HTMLに変換（色付き⭐🚩はSVGで描く）
function iconHTML(icon, size){
  icon = icon || '⭐';
  const m = /^(star|flag):(#[0-9a-fA-F]{6})$/.exec(icon);
  if(m){
    const c = m[2];
    const edge = (c==='#1c1c1e') ? '#fff' : '#000';
    const shape = m[1]==='star'
      ? `<path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.3 3.6 1.5-7.1L1.8 9.2 9 8.4z" fill="${c}" stroke="${edge}" stroke-opacity="0.55" stroke-width="1.2" stroke-linejoin="round"/>`
      : `<rect x="4" y="1.5" width="2.2" height="21" rx="1" fill="#777"/><path d="M6.2 2.5h14l-3.4 5 3.4 5h-14z" fill="${c}" stroke="${edge}" stroke-opacity="0.55" stroke-width="1.1" stroke-linejoin="round"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" style="vertical-align:middle;">${shape}</svg>`;
  }
  return `<span style="font-size:${size}px;line-height:1;">${icon}</span>`;
}

function buildIconGrid(){
  const grid = document.getElementById('icon-grid');
  let idx = 0;
  grid.innerHTML = ICON_GROUPS.map(g =>
    `<div class="icon-group">${g.map(ic => `<button type="button" class="icon-cell" data-idx="${idx++}" onclick="pickIconIdx(${idx-1})">${ic}</button>`).join('')}</div>`
  ).join('');
}

function refreshIconPicker(){
  document.getElementById('icon-current-preview').innerHTML = iconHTML(selectedIcon, 26);
  const base = iconBase(selectedIcon);
  document.querySelectorAll('#icon-grid .icon-cell').forEach(b=>{
    const ic = ICON_LIST[parseInt(b.dataset.idx)];
    const on = base ? (iconBase(ic)===base) : (ic===selectedIcon);
    b.classList.toggle('selected', on);
  });
  const colorRow = document.getElementById('icon-color-row');
  if(base){
    const cur = iconColor(selectedIcon);
    const baseEmoji = base==='star' ? '⭐' : '🚩';
    colorRow.innerHTML = `<span style="font-size:11px;color:#777;margin-right:2px;">${t('color_label')}</span>` +
      ICON_COLORS.map(c => {
        const inner = c==='default' ? baseEmoji : '';
        const bg = c==='default' ? '#08090d' : c;
        return `<button type="button" class="color-cell${c===cur?' selected':''}" style="background:${bg};" onclick="pickIconColor('${c}')">${inner}</button>`;
      }).join('');
    colorRow.style.display = 'flex';
  } else {
    colorRow.style.display = 'none';
    colorRow.innerHTML = '';
  }
}

function pickIconIdx(i){
  const ic = ICON_LIST[i];
  // 同じ⭐/🚩を押し直した時は色を保持
  if(iconBase(ic) && iconBase(ic)===iconBase(selectedIcon)) { refreshIconPicker(); return; }
  selectedIcon = ic;
  refreshIconPicker();
}

function pickIconColor(c){
  const base = iconBase(selectedIcon);
  if(!base) return;
  selectedIcon = (c==='default') ? (base==='star' ? '⭐' : '🚩') : `${base}:${c}`;
  refreshIconPicker();
}

  fillVisibilitySelect(document.getElementById('fp-visibility'), meta.visibility || 'private');

  document.getElementById('icon-grid').classList.remove('show');
  selectedIcon = icon || '⭐';
  refreshIconPicker();
}

// 固定ポイントのアイコン/名前/メモを、今のルート上の同じ固定ポイントにも反映
function syncLinkedRoutePoints(fpId, name, memo, icon){
  let changed = false;
  points.forEach(rp=>{
    if(rp.fixedPointId===fpId){ rp.name=name; rp.memo=memo; rp.icon=icon; changed=true; }
  });
  if(changed){ refreshAllMarkers(); renderList(); }
}

// 挿入位置セレクトの中身を構築（ルート追加・固定ポイント+ルート番号付与の両方で共通利用）
function updatePositionRow(){
  const posRow=document.getElementById('position-row');
  const sel=document.getElementById('modal-position');
  if(points.length>=2 && insertAfterIndex===null){
    // 地図タップ時のみ：位置を選ばせる
    posRow.style.display='block';
    document.getElementById('position-label').textContent=t('insert_pos_default',{n:points.length+1});
    sel.innerHTML='';
    const optEnd=document.createElement('option');
    optEnd.value=points.length;
    optEnd.textContent=t('insert_pos_end_option',{n:points.length+1});
    optEnd.selected=true;
    sel.appendChild(optEnd);
    for(let i=1;i<points.length;i++){
      const opt=document.createElement('option');
      opt.value=i;
      opt.textContent=t('insert_pos_between_option',{n:i+1,a:i,b:i+1});
      sel.appendChild(opt);
    }
  } else if(points.length>=2 && insertAfterIndex!==null){
    // ルートリストの+から来た場合：位置を表示するが変更不可（確認用）
    const insertPos=insertAfterIndex===-1?0:insertAfterIndex+1;
    const displayPos=insertPos+1;
    posRow.style.display='block';
    document.getElementById('position-label').textContent=t('insert_pos_label');
    sel.innerHTML=`<option value="${insertPos}" selected>${t('insert_pos_fixed',{n:displayPos})}</option>`;
  } else {
    posRow.style.display='none';
  }
}

function toggleFixedPointRouteRow(){
  const on = document.getElementById('fixedpoint-add-to-route').checked;
  showModalSegRow(on);
  // 既存の固定ポイントを編集中は、常に末尾に組み込むので挿入位置は出さない
  if(editingFixedPoint){ document.getElementById('position-row').style.display='none'; return; }
  const checked = on;

// 挿入位置を確定（ルートリストの+ / 地図タップ+位置選択 / 末尾）
function determineInsertPosition(){
  if(insertAfterIndex!==null){
    return insertAfterIndex===-1?0:insertAfterIndex+1;
  } else if(points.length>=2 && document.getElementById('position-row').style.display!=='none'){
    return parseInt(document.getElementById('modal-position').value);
  } else {
    return points.length;
  }
}

function insertRoutePointAt(name, memo, lat, lng, fixedPointId, icon){
  const p={id:Date.now(), lat, lng, name, memo, marker:null};
  if(fixedPointId){ p.fixedPointId = fixedPointId; p.icon = icon || '⭐'; }
  else if(document.getElementById('point-color-row').style.display!=='none' && editPointColor) p.color = editPointColor;
  const insertAt = determineInsertPosition();
  points.splice(insertAt,0,p);
  invalidateSeg(insertAt-1);
  // 前のポイントからこのポイントまでの区間に、選んだ移動手段を使う
  if(modalSegRowActive && insertAt>0 && points[insertAt-1]) points[insertAt-1].segMode = modalSegMode;
  rebuildAllMarkers();
  updatePolyline();
  renderList();
}

async function confirmModal(){
  const name=document.getElementById('modal-name').value.trim();
  const memo=document.getElementById('modal-memo-input').value.trim();
  const icon=selectedIcon || '⭐';
  const fpMeta = getFixedMeta();

  if(convertingRoutePointId!==null){
    // 普通のルートポイントを固定ポイントに変換
    const ok = await convertRoutePointToFixed(convertingRoutePointId, name, memo, icon, fpMeta);
    if(!ok) return;
  } else if(editingLinkedRoutePointId!==null){
    // ルート上の固定ポイントを編集：本体（saved_points）を更新し、ルート側の表示も同期
    const rp = points.find(x=>x.id===editingLinkedRoutePointId);
    if(rp){
      try{
        const res = await supabaseFetch(`/rest/v1/saved_points?id=eq.${rp.fixedPointId}`, {
          method: 'PATCH',
          prefer: 'return=minimal',
          body: JSON.stringify({ name, memo, icon, ...fpMeta })
        });
        if(res.ok){
          syncLinkedRoutePoints(rp.fixedPointId, name, memo, icon);
          loadSavedPoints();
        } else {
          alert(saveFailText(await res.text()));
          return;
        }
      }catch(e){
        alert(t('err_network'));
        return;
      }
    }
  } else if(editingFixedPoint!==null){
    // 既存の固定ポイントを編集
    try{
      const photoFields = await buildPhotoFields(editingFixedPoint.id);
      if(photoFields.__cancel) return;
      const res = await supabaseFetch(`/rest/v1/saved_points?id=eq.${editingFixedPoint.id}`, {
        method: 'PATCH',
        prefer: 'return=minimal',
        body: JSON.stringify({ name, memo, icon, ...fpMeta, ...photoFields })
      });
      if(res.ok){
        flushPhotoDelete();
        syncLinkedRoutePoints(editingFixedPoint.id, name, memo, icon);
        const addToRoute = document.getElementById('fixedpoint-route-toggle').style.display!=='none'
          && document.getElementById('fixedpoint-add-to-route').checked;
        if(addToRoute) addFixedPointToRoute({ ...editingFixedPoint, name, memo, icon, ...fpMeta });
        loadSavedPoints();
      } else {
        alert(saveFailText(await res.text()));
        return;
      }
    }catch(e){
      alert(t('err_network'));
      return;
    }
  } else if(editingId!==null){
    const p=points.find(x=>x.id===editingId);
    p.name=name; p.memo=memo;
    if(document.getElementById('point-color-row').style.display!=='none'){
      if(editPointColor) p.color = editPointColor; else delete p.color;
    }
    refreshAllMarkers(); renderList();
  } else if(modalTarget==='fixedpoint'){
    // 新規固定ポイントとして保存（＋任意でルート番号も付与）
    if(!pendingLatLng)return;
    if(!currentUser){ showAuthScreen(); return; }
    if(!(await ensureSlot('point'))) return;   // 固定ポイントの上限（無料30個＋増枠）
    try{
      const newId = crypto.randomUUID();
      const photoFields = await buildPhotoFields(newId);
      if(photoFields.__cancel) return;
      const res = await supabaseFetch('/rest/v1/saved_points', {
        method: 'POST',
        prefer: 'return=minimal',
        body: JSON.stringify({
          id: newId,
          user_id: currentUser.id,
          name, memo, icon, ...fpMeta, ...photoFields,
          lat: pendingLatLng.lat, lng: pendingLatLng.lng
        })
      });
      if(res.ok){
        addSavedPointMarker({ id:newId, user_id:currentUser.id, name, memo, icon, ...fpMeta, ...photoFields, lat:pendingLatLng.lat, lng:pendingLatLng.lng });
        const addToRoute = document.getElementById('fixedpoint-add-to-route').checked;
        if(addToRoute){
          insertRoutePointAt(name, memo, pendingLatLng.lat, pendingLatLng.lng, newId, icon);
        }
      } else {
        alert(saveFailText(await res.text()));
        return;
      }
    }catch(e){
      alert(t('err_network'));
      return;
    }
  } else {
    if(!pendingLatLng)return;
    insertRoutePointAt(name, memo, pendingLatLng.lat, pendingLatLng.lng);
  }

  document.getElementById('modal-overlay').classList.remove('show');
  const wasInsert=insertAfterIndex!==null;
  pendingLatLng=null; editingId=null; insertAfterIndex=null; editingFixedPoint=null; editingLinkedRoutePointId=null; convertingRoutePointId=null;
  if(typeof clearSearchResults==='function') clearSearchResults();
  // addModeは常に継続（連続追加可能）
  // 挿入ボタンのハイライトだけ解除
  insertAfterIndex=null;
  document.querySelectorAll('.insert-btn').forEach(b=>b.classList.remove('active'));
  if(addMode){
    const btn=document.getElementById('btn-add');
    btn.textContent=t('add_point_btn_active'); btn.className='btn btn-add-active';
  }
}

// ===== マーカー =====
function makeIcon(idx,state,color){
  const base = color || '#ff9f1c';
  const c=state==='cur'?['#2ea8ff','#fff']:state==='done'?['#555','#888']:[base,'#000'];
  const n=idx+1,fs=n>=100?9:n>=10?11:14;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">
    <path d="M17 0C7.6 0 0 7.6 0 17c0 11 17 27 17 27s17-16 17-27C34 7.6 26.4 0 17 0z" fill="${c[0]}" opacity="${state==='done'?0.4:1}"/>
    <circle cx="17" cy="17" r="11" fill="#fff" opacity="0.95"/>
    <text x="17" y="${17+fs*0.4}" text-anchor="middle" font-size="${fs}" font-weight="bold" fill="${c[0]}">${n}</text>
  </svg>`;
  return L.divIcon({html:svg,iconSize:[34,44],iconAnchor:[17,44],className:''});
}

// 固定ポイント由来のルートポイント用：番号ピンが★を指すように重ねた合成アイコン
function makeLinkedIcon(idx,state,starEmoji){
  const c=state==='cur'?['#2ea8ff','#fff']:state==='done'?['#555','#888']:['#ff9f1c','#000'];
  const n=idx+1,fs=n>=100?9:n>=10?11:14;
  const balloonSvg=`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">
    <path d="M17 0C7.6 0 0 7.6 0 17c0 11 17 27 17 27s17-16 17-27C34 7.6 26.4 0 17 0z" fill="${c[0]}" opacity="${state==='done'?0.4:1}"/>
    <circle cx="17" cy="17" r="11" fill="#fff" opacity="0.95"/>
    <text x="17" y="${17+fs*0.4}" text-anchor="middle" font-size="${fs}" font-weight="bold" fill="${c[0]}">${n}</text>
  </svg>`;
  const html=`<div style="display:flex;flex-direction:column;align-items:center;width:34px;">
    ${balloonSvg}

function getState(idx){
  if(!navActive)return'normal';
  if(idx<navIndex)return'done';
  if(idx===navIndex)return'cur';
  return'normal';
}

function addMarker(p,idx){
  const isLinked = !!p.fixedPointId;
  const icon = p.icon ? makeLinkedIcon(idx,getState(idx),p.icon) : makeIcon(idx,getState(idx),p.color);
  // 動かせるピンは必ず「draggable:true」で作ってから止める。
  // 回転部品は、作った時に動かせる設定のピンにだけ「地図の回転に対応した動かし方」を組み込むため。
  // （後から動かせるようにしたピンは、地図が回っている時に動かすと別の場所へ飛んでいた）
  const m=L.marker([p.lat,p.lng],{icon, draggable: !isLinked}).addTo(map);
  if(m.dragging && (isLinked || !addMode)) m.dragging.disable();
  m.bindTooltip(makeTooltip(p,idx),{direction:'top',offset:[0,-40]});
  if(isLinked){
    m.on('click',function(e){ L.DomEvent.stopPropagation(e);
      if(addMode) openLinkedRoutePointModal(p.id);
      else showInfoPopup(e.latlng, (p.name||t('nav_point_default',{n:idx+1})), p.memo);
    });
  } else {
    m.on('click',function(e){ L.DomEvent.stopPropagation(e);
      if(addMode) _openEditFromMarker(p.id);
      else showInfoPopup(e.latlng, (p.name||t('nav_point_default',{n:idx+1})), p.memo);
    });
    m.on('dragend',e=>{
      p.lat=e.target.getLatLng().lat; p.lng=e.target.getLatLng().lng;
      const i = points.findIndex(x=>x.id===p.id);
      invalidateSeg(i); invalidateSeg(i-1);
      updatePolyline();
    });
  }
  p.marker=m;
}

function makeTooltip(p,idx){
  const star = p.icon ? iconHTML(p.icon,14)+' ' : '';
  return `<b>${star}${idx+1}${p.name?' - '+p.name:''}</b>${p.memo?'<br><span style="color:#ff9f1c">'+p.memo+'</span>':''}`;
}

// 全マーカーを削除して再生成（挿入時に番号を正しく振り直す）
function rebuildAllMarkers(){
  points.forEach(p=>{if(p.marker){map.removeLayer(p.marker);p.marker=null;}});
  points.forEach((p,i)=>addMarker(p,i));
}

function refreshAllMarkers(){
  points.forEach((p,i)=>{
    if(!p.marker)return;
    const icon = p.icon ? makeLinkedIcon(i,getState(i),p.icon) : makeIcon(i,getState(i),p.color);
    p.marker.setIcon(icon);
    p.marker.setTooltipContent(makeTooltip(p,i));
  });
}

// ===== ポリライン =====
function clearPolylines(){ polylines.forEach(l=>map.removeLayer(l)); polylines=[]; }

// ===== 区間（ポイントとポイントの間）の移動手段と線の色 =====
// 区間 i は points[i] → points[i+1]。設定は points[i] に持たせる（segMode / segColor）
const SEG_MODES = ['car','foot','bike','straight','train','plane'];
const SEG_ICONS = { car:'🚗', foot:'🚶', bike:'🚲', straight:'📏', train:'🚃', plane:'✈️' };
const SEG_DEFAULT_COLORS = { car:'#ff9f1c', foot:'#2fd6a5', bike:'#45c7ff', straight:'#00d5c8', train:'#9b7bff', plane:'#ff5c8a' };
const SEG_COLOR_CHOICES = ['#ff9f1c','#2fd6a5','#45c7ff','#9b7bff','#ff5c8a','#ffffff','#e8e8ea','#00d5c8'];
// 線の種類（Leafletのdash指定）
const SEG_STYLES = {
  solid:   null,
  dash:    '12,8',
  dot:     '2,7',
  dashdot: '14,6,2,6',
  fine:    '5,5',
  long:    '24,10'
};
// 移動手段ごとの既定色（設定画面で変えられる。端末に保存）
let segUserColors = {};
try{ segUserColors = JSON.parse(localStorage.getItem('navi_seg_colors') || '{}'); }catch(e){ segUserColors = {}; }
function segDefaultColor(mode){ return segUserColors[mode] || SEG_DEFAULT_COLORS[mode]; }

// 移動手段ごとの既定の線の種類（設定画面で変えられる。端末に保存）
let segUserStyles = {};
try{ segUserStyles = JSON.parse(localStorage.getItem('navi_seg_styles') || '{}'); }catch(e){ segUserStyles = {}; }
function segDefaultStyleKey(mode){
  return segUserStyles[mode] || ((mode==='train'||mode==='plane') ? 'dash' : 'solid');
}
// 道に沿わせる移動手段だけ経路を取りに行く（電車と飛行機は点線でまっすぐ）
const SEG_PROFILE = { car:'routed-car', foot:'routed-foot', bike:'routed-bike' };
const routeGeoCache = {};
let polyToken = 0;

function segModeOf(i){ return (points[i] && points[i].segMode) || 'car'; }
function segColorOf(i){ return (points[i] && points[i].segColor) || segDefaultColor(segModeOf(i)); }
function segStyleOf(i){
  const p = points[i];
  if(p && p.segStyle && SEG_STYLES[p.segStyle]!==undefined) return SEG_STYLES[p.segStyle];
  return SEG_STYLES[segDefaultStyleKey(segModeOf(i))];
}
function segIsStraight(mode){ return !SEG_PROFILE[mode]; }

async function fetchSegmentGeometry(a, b, mode){
  const key = `${mode}|${a.lat.toFixed(5)},${a.lng.toFixed(5)}|${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
  if(routeGeoCache[key]) return routeGeoCache[key];
  const url = `https://routing.openstreetmap.de/${SEG_PROFILE[mode]}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&continue_straight=true`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.code!=='Ok' || !data.routes.length) throw new Error('no route');
  const out = { geometry: data.routes[0].geometry, distance: data.routes[0].distance };
  routeGeoCache[key] = out;
  return out;
}

// 区間の道のりの長さを測る
function pathLength(coords){
  let d=0;
  for(let k=1;k<coords.length;k++) d += calcDist(coords[k-1][0],coords[k-1][1],coords[k][0],coords[k][1]);
  return d;
}

// この区間の線を引き直す必要をなくす（覚えている線を捨てる）
function invalidateSeg(i){ if(points[i]) delete points[i].segPath; }
function invalidateAllSegs(){ points.forEach(p=>delete p.segPath); }

async function updatePolyline(){
  clearPolylines();
  if(points.length<2) return;
  const token = ++polyToken;
  const dists = [];
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    const mode = segModeOf(i), color = segColorOf(i);
    const dash = segStyleOf(i);
    // すでに引いてある線があれば、それをそのまま使う（移動手段を変えても道は変えない）
    if(a.segPath && a.segPath.length>1 && useRoad && mode!=='straight'){
      const line = L.polyline(a.segPath, {color, weight:5, opacity:0.85, dashArray:dash}).addTo(map);
      polylines.push(line);
      dists[i] = pathLength(a.segPath);
      continue;
    }
    const straight = !useRoad || segIsStraight(mode);
    const tmp = L.polyline([[a.lat,a.lng],[b.lat,b.lng]],
      { color, weight: straight?4:3, opacity: straight?0.9:0.35,
        dashArray: dash || (straight ? null : '6,6') }).addTo(map);
    polylines.push(tmp);
    dists[i] = calcDist(a.lat,a.lng,b.lat,b.lng);
    if(straight) continue;
    try{
      const r = await fetchSegmentGeometry(a,b,mode);
      if(token!==polyToken){ if(map.hasLayer(tmp)) map.removeLayer(tmp); return; }
      map.removeLayer(tmp); polylines = polylines.filter(l=>l!==tmp);
      const coords = r.geometry.coordinates.map(c=>[+c[1].toFixed(5), +c[0].toFixed(5)]);
      a.segPath = coords; // 覚えておく
      const line = L.polyline(coords, {style:null, color, weight:5, opacity:0.85}).addTo(map);
      polylines.push(line);
      dists[i] = r.distance;
    }catch(e){ console.warn('経路取得に失敗', e); }
  }
  if(token!==polyToken) return;
  segmentDistances = dists;
  renderList();
}

// ===== 再生モード（ルートの線が伸びていく） =====
let playLayer = null;       // 再生用の線とアイコンを入れる層
let playSegs = [];          // 区間ごとの座標と色
let playTotal = 0;          // 全体の距離(m)
let playPos = 0;            // 今どこまで進んだか(m)
let playSpeed = 1;          // 速度倍率
let playRunning = false;
let playRAF = null;
let playLastT = 0;
let playMarker = null;
let playLineMode = 'trail'; // trail=通ったぶんだけ / highlight=全部薄く＋通過を濃く / all=最初から全部
let playBaseLines = [], playProgLines = [];
let playHiddenMarkers = [];

function playIconHTML(deg){
  const rot = document.getElementById('play-rotate');
  if(rot && !rot.checked) deg = 0;
  const inner = gpsIconData
    ? `<img src="${gpsIconData}" style="width:44px;height:44px;object-fit:contain;display:block;">`
    : `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2ea8ff" stroke="#fff" stroke-width="2"/><path d="M12 5l4 9-4-2-4 2z" fill="#fff"/></svg>`;
  return `<div style="transform:rotate(${deg}deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));">${inner}</div>`;
}

// 区間ごとの座標を用意する（道に沿う区間は経路を取得、電車・飛行機は直線）
async function buildPlaySegments(){
  const segs = [];
  for(let i=0;i<points.length-1;i++){
    const a=points[i], b=points[i+1];
    const mode = segModeOf(i), color = segColorOf(i);
    let coords = [[a.lat,a.lng],[b.lat,b.lng]];
    if(a.segPath && a.segPath.length>1 && useRoad && mode!=='straight'){
      coords = a.segPath;
    } else if(useRoad && !segIsStraight(mode)){
      try{
        const r = await fetchSegmentGeometry(a,b,mode);
        coords = r.geometry.coordinates.map(c=>[c[1],c[0]]);
      }catch(e){ /* 取れなければ直線 */ }
    }
    // 区間内の距離の積み上げ
    const cum=[0];
    for(let k=1;k<coords.length;k++){
      cum.push(cum[k-1] + calcDist(coords[k-1][0],coords[k-1][1],coords[k][0],coords[k][1]));
    }
    segs.push({ coords, cum, len: cum[cum.length-1], color, mode, dash: segStyleOf(i), endIndex: i+1 });
  }
  return segs;
}

async function startPlayback(){
  if(points.length<2){ alert(t('play_need_points')); return; }
  toggleMapControlsPanel();
  stopPlay(true);
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  playSegs = await buildPlaySegments();
  playTotal = playSegs.reduce((a,s)=>a+s.len,0);
  if(!playTotal){ alert(t('play_need_points')); return; }
  playLayer = L.layerGroup().addTo(map);
  // ルートの線とピンはいったん隠す
  clearPolylines();
  playHiddenMarkers = [];
  const showPinsFromStart = document.getElementById('play-pins').checked;
  points.forEach(p=>{ if(p.marker){ p.marker.setOpacity(showPinsFromStart?1:0); playHiddenMarkers.push(p.marker); } });
  // 現在地のアイコンと精度の円は隠す
  if(gpsMarker && map.hasLayer(gpsMarker)) map.removeLayer(gpsMarker);
  if(gpsCircle && map.hasLayer(gpsCircle)) map.removeLayer(gpsCircle);
  buildPlayLines();
  playMarker = L.marker(playSegs[0].coords[0], {icon:L.divIcon({html:playIconHTML(0), iconSize:[44,44], iconAnchor:[22,22], className:''}), zIndexOffset:2000}).addTo(playLayer);
  playPos = 0;
  setViewVisible(playSegs[0].coords[0], Math.max(map.getZoom(),15));
  document.getElementById('play-bar').classList.add('show');
  updateRecDirBtn();
  document.getElementById('play-slider').value = 0;
  setPlayLineModeLabels();
  // すぐには走らせず、スタート地点で一時停止した状態で待つ（▶か🎬で開始）
  playRunning = false;
  requestWakeLock();
  refreshAdVisibility();
  document.getElementById('play-toggle').textContent = '▶';
  drawPlayAt(0);
}

function buildPlayLines(){
  playBaseLines.forEach(l=>playLayer.removeLayer(l));
  playProgLines.forEach(l=>playLayer.removeLayer(l));
  playBaseLines = []; playProgLines = [];
  playSegs.forEach(sg=>{
    if(playLineMode!=='trail'){
      const op = playLineMode==='highlight' ? 0.25 : 0.85;
      const base = L.polyline(sg.coords, {color:sg.color, weight:4, opacity:op, dashArray:sg.dash}).addTo(playLayer);
      playBaseLines.push(base);
    }
    const prog = L.polyline([], {color:sg.color, weight:6, opacity:0.95, dashArray:sg.dash}).addTo(playLayer);
    playProgLines.push(prog);
  });
}

function setPlayLineMode(v){
  playLineMode = v;
  if(!playLayer) return;
  buildPlayLines();
  drawPlayAt(playPos);
}

function setPlayLineModeLabels(){
  const sel = document.getElementById('play-line-mode');
  sel.options[0].textContent = t('play_line_trail');
  sel.options[1].textContent = t('play_line_highlight');
  sel.options[2].textContent = t('play_line_all');
  sel.value = playLineMode;
}

// 今の進み具合に合わせて線とアイコンを描く
function drawPlayAt(dist){
  let remain = dist, pos = null, heading = 0, reached = 0;
  for(let i=0;i<playSegs.length;i++){
    const sg = playSegs[i];
    if(remain >= sg.len){
      playProgLines[i].setLatLngs(sg.coords);
      remain -= sg.len;
      reached = sg.endIndex;
      if(i===playSegs.length-1){ pos = sg.coords[sg.coords.length-1]; heading = headingOf(sg.coords, sg.coords.length-1); }
      continue;
    }
    // この区間の途中
    let k=1;
    while(k<sg.cum.length && sg.cum[k] < remain) k++;
    const a = sg.coords[k-1], b = sg.coords[Math.min(k, sg.coords.length-1)];
    const segLen = sg.cum[Math.min(k, sg.cum.length-1)] - sg.cum[k-1];
    const f = segLen>0 ? (remain - sg.cum[k-1])/segLen : 0;
    pos = [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
    heading = bearing(a[0],a[1],b[0],b[1]);
    playProgLines[i].setLatLngs(sg.coords.slice(0,k).concat([pos]));
    for(let j=i+1;j<playSegs.length;j++) playProgLines[j].setLatLngs([]);
    break;
  }
  if(!pos){ const last = playSegs[playSegs.length-1]; pos = last.coords[last.coords.length-1]; }
  // 最後まで来たら、最後のポイントも「到達」にする
  // （距離の足し引きのわずかな誤差で、最後の区間が「途中」と判定され、最後のピンが出なかった）
  if(dist >= playTotal - 0.5) reached = Math.max(reached, playSegs[playSegs.length-1].endIndex);
  playReached = reached;
  // 写真は「さしかかった」時に出す：到着の約1秒前（再生速度に合わせた距離。最低30m）
  const lead = Math.max(30, PLAY_BASE_SPEED * playSpeed * 1.0);
  let acc = 0, appr = 0;
  for(const sg of playSegs){ acc += sg.len; if(acc <= dist + lead) appr = sg.endIndex; else break; }
  playApproach = Math.max(appr, reached);
  playMarker.setLatLng(pos);
  playMarker.setIcon(L.divIcon({html:playIconHTML(heading + mapBearingDeg()), iconSize:[44,44], iconAnchor:[22,22], className:''}));
  // 通り過ぎたポイントのピンを出す
  const showAllPins = document.getElementById('play-pins').checked;
  points.forEach((p,idx)=>{ if(p.marker) p.marker.setOpacity((showAllPins || idx<=reached) ? 1 : 0); });
  if(document.getElementById('play-follow').checked) panToVisible(pos, {animate:false});
  document.getElementById('play-dist').textContent = formatDist(dist) + ' / ' + formatDist(playTotal);
  // 指でシークバーを動かしている間は、再生側から値を書き戻さない（書き戻すと指の位置に戻されて動かせない）
  if(!playSeeking) document.getElementById('play-slider').value = Math.round(dist/playTotal*1000);
}

function headingOf(coords, i){
  const a = coords[Math.max(0,i-1)], b = coords[i];
  return bearing(a[0],a[1],b[0],b[1]);
}

function bearing(lat1,lng1,lat2,lng2){
  const φ1=lat1*Math.PI/180, φ2=lat2*Math.PI/180, Δλ=(lng2-lng1)*Math.PI/180;
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

const PLAY_BASE_SPEED = 100; // 1倍のとき1秒あたり100m進む
function playStep(now){
  if(!playRunning) return;
  const dt = Math.min((now-playLastT)/1000, 0.1);
  playLastT = now;
  playPos += PLAY_BASE_SPEED * playSpeed * dt;
  if(playPos >= playTotal){
    playPos = playTotal;
    drawPlayAt(playPos);
    playRunning = false;
    document.getElementById('play-toggle').textContent = '▶';
    if(recActive) setTimeout(()=>{ if(recActive) exitRecMode(); }, 1500);
    return;
  }
  drawPlayAt(playPos);
  playRAF = requestAnimationFrame(playStep);
}

function togglePlay(){
  if(!playLayer) return;
  if(playRunning){
    playRunning = false;
    document.getElementById('play-toggle').textContent = '▶';
  } else {
    if(playPos >= playTotal) playPos = 0;
    playRunning = true;
    document.getElementById('play-toggle').textContent = '⏸';
    playLastT = performance.now();
    playRAF = requestAnimationFrame(playStep);
  }
}

function restartPlay(){
  if(!playLayer) return;
  playPos = 0;
  drawPlayAt(0);
  if(!playRunning) togglePlay();
}

// シークバーを触っている最中かどうか
let playSeeking = false;
(function(){
  const sl = document.getElementById('play-slider');
  if(!sl) return;
  const on = ()=>{ playSeeking = true; };
  const off = ()=>{ playSeeking = false; };
  ['pointerdown','touchstart','mousedown'].forEach(ev=>sl.addEventListener(ev, on, {passive:true}));
  ['pointerup','pointercancel','touchend','touchcancel','mouseup','change'].forEach(ev=>sl.addEventListener(ev, off, {passive:true}));
})();

function seekPlay(v){
  if(!playLayer) return;
  playPos = playTotal * (v/1000);
  drawPlayAt(playPos);
}

// ===== 録画モード =====
// ボタン類を全部隠して、地図とルート再生だけにする。画面をタップすると元に戻る
let recPrevPanelState = null, recTimer = null;
// 録画モード中は、スマホ上部のステータスバー（時計・電池など）も隠す
function recSystemBars(hide){
  try{
    if(isNativeApp()){
      // アプリ：@capacitor/status-bar を使う（入っていなければ何もしない）
      const sb = window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;
      if(sb) (hide ? sb.hide() : sb.show()).catch(()=>{});
    } else if(hide){
      // Web：ブラウザの全画面表示（対応していない端末では何もしない）
      const el = document.documentElement;
      if(el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(()=>{});
    } else if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});
    }
  }catch(e){ console.warn('recSystemBars', e); }
}

// ===== 録画（PCのブラウザ：Chrome・Edgeなど） =====
// スマホのブラウザには画面録画の機能が無いので、録画できるのはPCのブラウザだけ
function canWebRecord(){
  return !isNativeApp() && !!(navigator.mediaDevices && typeof navigator.mediaDevices.getDisplayMedia === 'function') && typeof window.MediaRecorder === 'function';
}
let recStream = null, recRecorder = null, recChunks = [], recMime = '', recActive = false;
let recKind = null; // 'web'＝PCブラウザで録画 / 'native'＝アプリで録画 / null＝表示だけ
let recArmed = null; // 録画の準備（共有の許可）が済んでいる種類。もう一度🎬で録画開始
let recRewardCredit = false; // リワード動画を見て得た「録画1回分」（録画を始めた時に使う）
// アプリ（Android）の録画プラグイン（自作：ScreenRecorder）
function nativeRecorder(){
  return (isNativeApp() && window.Capacitor.Plugins && window.Capacitor.Plugins.ScreenRecorder) || null;
}
function canNativeRecord(){ return !!nativeRecorder(); }
function showNativeSaved(r){
  if(r && r.ok) alert(t('rec_saved_dir',{dir:r.folder, file:r.file}));
  else alert(t('rec_save_fail'));
}
// 通知などアプリの外から録画が止められた時
try{
  const nr = nativeRecorder();
  if(nr) nr.addListener('recordingStopped', r=>{
    if(r && r.recorded){
      if(recKind === 'native'){ recActive = false; recKind = null; exitRecMode(); }
      showNativeSaved(r);
    } else if(recArmed === 'native'){
      setRecArmed(null);   // 準備中に共有が止められた
    }
  });
}catch(e){ console.warn('recordingStopped listener', e); }

// 保存先フォルダの記憶（ブラウザ内のIndexedDBに、選んだフォルダの「鍵」をしまう）
function recDb(){
  return new Promise((ok,ng)=>{
    const r = indexedDB.open('michishirube-rec', 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
    r.onsuccess = ()=> ok(r.result); r.onerror = ()=> ng(r.error);
  });
}
async function recDbGet(k){ const db = await recDb(); return new Promise(ok=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(null); }); }
async function recDbSet(k,v){ const db = await recDb(); return new Promise(ok=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>ok(); tx.onerror=()=>ok(); }); }

// 📁ボタン：保存先フォルダを選ぶ
async function chooseRecDir(){
  const nr = nativeRecorder();
  if(nr){
    try{ const r = await nr.chooseFolder(); updateRecDirBtn(); alert(t('rec_dir_set',{name:r.folder})); }catch(e){ /* キャンセル */ }
    return;
  }
  if(!window.showDirectoryPicker){ alert(t('rec_dir_unsupported')); return; }
  try{
    const h = await window.showDirectoryPicker({ id:'michishirube-rec', mode:'readwrite', startIn:'videos' });
    await recDbSet('dir', h);
    updateRecDirBtn(h);
    alert(t('rec_dir_set',{name:h.name}));
  }catch(e){ /* キャンセル */ }
}
async function updateRecDirBtn(h){
  const b = document.getElementById('rec-dir-btn'); if(!b) return;
  const nr = nativeRecorder();
  if(nr){
    b.style.display = '';
    try{ const r = await nr.getFolder(); b.title = t('rec_dir_btn') + '：' + r.folder; }catch(e){}
    return;
  }
  if(!canWebRecord()){ b.style.display = 'none'; return; }
  b.style.display = '';
  if(h === undefined){ try{ h = await recDbGet('dir'); }catch(e){ h = null; } }
  b.title = h ? t('rec_dir_btn') + '：' + h.name : t('rec_dir_btn') + '：' + t('rec_downloads');
}

function recFileName(ext){
  const d = new Date(), z = n=>String(n).padStart(2,'0');
  return `michishirube-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.${ext}`;
}

// 録画を保存して、どこに保存したかを知らせる
async function saveRecording(blob, dirPerm){
  const ext = recMime.includes('mp4') ? 'mp4' : 'webm';
  const name = recFileName(ext);
  // ① 保存先フォルダが決まっていて、書き込みの許可があればそこへ
  try{
    const h = await recDbGet('dir');
    if(h && (await dirPerm) === 'granted'){
      const fh = await h.getFileHandle(name, { create:true });
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      alert(t('rec_saved_dir',{dir:h.name, file:name}));
      return;
    }
  }catch(e){ console.warn('フォルダへの保存に失敗、ダウンロードで保存', e); }
  // ② それ以外はブラウザのダウンロードとして保存
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    alert(t('rec_saved_dl',{file:name}));
  }catch(e){ alert(t('rec_save_fail')); }
}

// 保存先フォルダへの書き込み許可を確認（タップした瞬間に呼ぶ必要がある）
async function recDirPermission(){
  try{
    const h = await recDbGet('dir'); if(!h) return 'none';
    let st = await h.queryPermission({ mode:'readwrite' });
    if(st !== 'granted') st = await h.requestPermission({ mode:'readwrite' });
    return st;
  }catch(e){ return 'denied'; }
}

async function startWebRecording(){
  // ブラウザが「どの画面を共有するか」を聞いてくる（このタブを選ぶ）
  recStream = await navigator.mediaDevices.getDisplayMedia({
    video:{ frameRate:30, displaySurface:'browser' }, audio:false,
    preferCurrentTab:true, selfBrowserSurface:'include', surfaceSwitching:'exclude'
  });
  // 共有をブラウザ側で止められた時も、録画を終了して保存する
  recStream.getVideoTracks()[0].addEventListener('ended', ()=>{
    if(recActive) exitRecMode();
    else if(recArmed === 'web'){ recRecorder = null; recStream = null; setRecArmed(null); }
  });
  const types = ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  recMime = types.find(x=>MediaRecorder.isTypeSupported(x)) || '';
  recRecorder = new MediaRecorder(recStream, recMime ? { mimeType:recMime, videoBitsPerSecond:8000000 } : undefined);
  recMime = recRecorder.mimeType || recMime || 'video/webm';
  recChunks = [];
  recRecorder.ondataavailable = e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
}

// 🎬ボタンの見た目（準備済みは赤）
function setRecArmed(kind){
  recArmed = kind;
  const b = document.getElementById('rec-btn');
  if(b){
    b.classList.toggle('armed', !!kind);
    b.title = t(kind ? 'rec_start_btn' : 'play_rec');
  }
}
// 準備を取り消す（再生を閉じた時など）
function recDisarm(){
  if(recArmed === 'native'){ try{ nativeRecorder().cancel().catch(()=>{}); }catch(e){} }
  if(recArmed === 'web' && recStream){ recStream.getTracks().forEach(tr=>tr.stop()); recStream = null; recRecorder = null; }
  setRecArmed(null);
}

// 🎬ボタン
//  1回目：共有（録画）の許可をもらう → 再生画面に戻って「もう一度🎬で録画開始」と案内
//  2回目：ボタン類を消して録画開始 → 1秒止まってから再生
// 録画してよいかの確認
//  ・ログイン必須　・有料会員は無制限　・Webの無料は不可　・アプリの無料はリワード動画1本で1回（1日3回まで）
async function recGate(){
  if(!canNativeRecord() && !currentUser){ alert(t('rec_web_premium_only')); return false; }
  if(!currentUser){ alert(t('rec_login_required')); return false; }
  const st = await recordingStatus();
  if(!st){ alert(t('err_network')); return false; }
  premiumFlag = !!st.premium;
  if(st.premium) return true;
  if(!canNativeRecord()){ alert(t('rec_web_premium_only')); return false; }
  if(recRewardCredit) return true;
  if((st.remaining|0) <= 0){ alert(t('rec_limit_reached')); return false; }
  if(!confirm(t('rec_reward_confirm',{n:st.remaining}))) return false;
  const got = await showRewardedAd();
  if(got === null){ alert(t('rec_reward_load_fail')); return false; }
  if(!got){ alert(t('rec_reward_not_done')); return false; }
  recRewardCredit = true;
  return true;
}

async function onRecButton(){
  if(!playLayer) return;
  if(document.body.classList.contains('rec-mode')) return;
  if(recArmed){ enterRecMode(); return; }
  if(canNativeRecord() || canWebRecord()){
    if(playRunning) togglePlay();
    if(!(await recGate())) return;
  }
  if(canNativeRecord()){
    if(playRunning) togglePlay();
    try{ await nativeRecorder().prepare(); setRecArmed('native'); alert(t('rec_ready')); }
    catch(e){ if(!e || e.code !== 'CANCELLED') alert(t('rec_fail')); }
    return;
  }
  if(canWebRecord()){
    if(playRunning) togglePlay();
    try{ await startWebRecording(); setRecArmed('web'); alert(t('rec_ready')); }
    catch(e){ console.warn('録画準備失敗', e); recStream = null; recRecorder = null; alert(t('rec_fail')); }
    return;
  }
  // スマホのブラウザ：録画はできないので、画面だけ整えて端末の画面録画を使ってもらう
  if(!isNativeApp()) alert(t('rec_mobile_web'));
  enterRecMode();
}

function enterRecMode(){
  if(!playLayer) return;
  if(document.body.classList.contains('rec-mode')) return;
  recKind = recArmed;               // 'web' / 'native' / null（表示だけ）
  recPrevPanelState = panelState;
  if(recKind !== 'web') recSystemBars(true);
  document.getElementById('map-controls-panel').style.display = 'none';
  document.body.classList.add('rec-mode');
  setPanelState('hidden');
  // 今の位置で一時停止（最後まで再生し終わっている時だけ最初に戻す）
  if(playRunning) togglePlay();
  if(playPos >= playTotal){ playPos = 0; document.getElementById('play-slider').value = 0; }
  drawPlayAt(playPos);
  const hint = document.getElementById('rec-hint');
  hint.textContent = t(recKind ? 'rec_hint_recording' : 'play_rec_hint');
  hint.classList.remove('hide');
  clearTimeout(recTimer);
  const kind = recKind;
  recTimer = setTimeout(()=>{
    hint.classList.add('hide');
    recTimer = setTimeout(async ()=>{
      if(!document.body.classList.contains('rec-mode') || recKind !== kind) return;
      // 無料：ここで録画1回分を使う（今日の上限を超えていたら止める）
      if(kind && !isPremium()){
        const r = await useRecording();
        if(!r || !r.ok){
          exitRecMode();
          alert(r && r.reason === 'limit' ? t('rec_limit_reached') : t('rec_fail'));
          return;
        }
        if(r.premium) premiumFlag = true;
        recRewardCredit = false;
      }
      // 案内が消えてから録画開始（案内は動画に入らない）
      if(kind === 'web' && recRecorder && recRecorder.state === 'inactive'){
        recRecorder.start(1000); recActive = true; setRecArmed(null);
      } else if(kind === 'native'){
        try{ await nativeRecorder().record(); recActive = true; setRecArmed(null); }
        catch(e){ exitRecMode(); alert(t('rec_fail')); return; }
      }
      // 録画が始まってから1秒は、アイコンを止めたまま映す
      recTimer = setTimeout(()=>{ if(document.body.classList.contains('rec-mode') && !playRunning) togglePlay(); }, kind ? 1000 : 0);
    }, 600);
  }, 1500);
}

function exitRecMode(){
  if(!document.body.classList.contains('rec-mode')) return;
  clearTimeout(recTimer);
  if(recKind === 'native'){
    if(recActive){
      // アプリの録画を止めて保存 → どこに保存したかを表示
      recActive = false;
      nativeRecorder().stop().then(showNativeSaved).catch(()=>alert(t('rec_save_fail')));
    }
    // 録画開始前に抜けた時は、準備はそのまま（もう一度🎬で開始できる）
    recKind = null;
    recSystemBars(false);
  } else if(recKind === 'web'){
    if(recActive && recRecorder){
      // PCブラウザの録画を止めて保存（フォルダの許可確認はタップした瞬間に始める）
      const rec = recRecorder, stream = recStream;
      const perm = recDirPermission();
      recRecorder = null; recStream = null; recActive = false;
      rec.onstop = ()=>{
        if(stream) stream.getTracks().forEach(tr=>tr.stop());
        if(recChunks.length) saveRecording(new Blob(recChunks, { type:recMime }), perm);
        recChunks = [];
      };
      rec.stop();
    }
    recKind = null;
  } else {
    recKind = null;
    recSystemBars(false);
  }
  document.body.classList.remove('rec-mode');
  if(playRunning) togglePlay();
  setPanelState(recPrevPanelState || 'full');
}

function stopPlay(silent){
  exitRecMode();
  recDisarm();
  playRunning = false;
  setTimeout(refreshAdVisibility, 0);
  if(!navActive) releaseWakeLock();
  if(playRAF) cancelAnimationFrame(playRAF);
  if(playLayer){ map.removeLayer(playLayer); playLayer = null; }
  playBaseLines = []; playProgLines = []; playMarker = null; playSegs = [];
  points.forEach(p=>{ if(p.marker) p.marker.setOpacity(1); });
  // 現在地のアイコンを戻す
  if(gpsMarker && !map.hasLayer(gpsMarker)) gpsMarker.addTo(map);
  if(gpsCircle && !map.hasLayer(gpsCircle)) gpsCircle.addTo(map);
  document.getElementById('play-bar').classList.remove('show');
  if(!silent) updatePolyline();
}

function renderList(){
  if(typeof updatePanelMetrics === 'function') setTimeout(updatePanelMetrics, 0);
  const el=document.getElementById('points-wrap');
  if(!points.length){el.innerHTML=`<div class="empty-msg">${t('empty_points_msg')}<br>${t('empty_points_sub')}</div>`;refreshSavedPointVisibility();return;}

  let html='';
  points.forEach((p,i)=>{
    const state=getState(i);
    const rowClass=state==='cur'?'current-row':state==='done'?'done-row':'';
    const numClass=state==='done'?'done':'';
    const displayName=p.name||'';
    const isLinked = !!p.fixedPointId;
    const starPrefix = p.icon ? `<span style="display:inline-flex;align-items:center;">${iconHTML(p.icon,16)}</span>` : '';
    const numOnclick = !addMode
      ? `focusPoint(${p.id})`
      : (isLinked
        ? `_suppressMapClick=true; openLinkedRoutePointModal(${p.id})`
        : `_suppressMapClick=true; openEditPopup(${p.id}, this)`);

    // 先頭の前に挿入ボタン（ポイントが2つ以上の時のみ）
    if(addMode && i===0 && points.length>=2){
      html+=`<div class="insert-row"><button class="insert-btn" data-after="-1" onclick="startInsertAt(-1)">＋</button></div>`;
    }

    const segDist = segmentDistances[i] != null ? formatDist(segmentDistances[i]) : '';
    html+=`<div class="point-row ${rowClass}">
      ${starPrefix}
      <div class="point-num ${numClass}" onclick="${numOnclick}" style="cursor:pointer;">${i+1}</div>
      <div class="point-info" onclick="focusPoint(${p.id})">
        <div class="point-name">${displayName}</div>
        ${p.memo?`<div class="point-memo-label">📝 ${p.memo}</div>`:''}
        ${segDist?`<div style="font-size:13px;color:#7e7e8b;margin-top:2px;">→ ${segDist}</div>`:''}
      </div>
      ${addMode?`<button class="point-del" onclick="deletePoint(${p.id})">✕</button>`:''}
    </div>`;

    // ポイントとポイントの間に挿入ボタン（ポイントが2つ以上の時のみ）
    if(i<points.length-1){
      const m = segModeOf(i), c = segColorOf(i);
      const dv = segStyleOf(i);
      const dashStyle = dv
        ? `background:repeating-linear-gradient(90deg, ${c} 0 ${parseInt(dv)}px, transparent ${parseInt(dv)}px ${parseInt(dv)+6}px);`
        : `background:${c};`;
      html+=`<div class="seg-row">
        <span class="seg-chip" ${addMode?`onclick="openSegDialog(${i})"`:''}>${SEG_ICONS[m]}${addMode?' ▾':''}</span>
        <span class="seg-dash" style="${dashStyle}"></span>
      </div>`;
    }
    if(addMode && i<points.length-1 && points.length>=2){
      html+=`<div class="insert-row"><button class="insert-btn" data-after="${i}" onclick="startInsertAt(${i})">＋</button></div>`;
    }
  });

  el.innerHTML=html;
  refreshSavedPointVisibility();
  if(navActive){
    const rows=el.querySelectorAll('.point-row');
    if(rows[navIndex])rows[navIndex].scrollIntoView({behavior:'smooth',block:'center'});
  }
  setTimeout(updateScrollBtns,50);
}

function focusPoint(id){
  const p=points.find(x=>x.id===id);
  if(!p)return;
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));
}

function deletePoint(id){
  const i=points.findIndex(x=>x.id===id);
  if(i===-1)return;
  map.removeLayer(points[i].marker);
  points.splice(i,1);
  invalidateSeg(i-1);
  if(navActive&&i<navIndex)navIndex--;
  if(navActive&&navIndex>=points.length)navIndex=Math.max(0,points.length-1);
  if(points.length===0)clearPolylines();
  rebuildAllMarkers();
  updatePolyline();
  renderList();
  if(navActive)updateNavBar();
}

// 検索：自分の固定ポイント・ルートポイントの名前とメモ → そのあと地図の場所（10km以内）
async function searchAddress(){
  const q=document.getElementById('search-input').value.trim();
  if(!q)return;
  const btn=document.querySelector('#search-row .btn-orange');
  btn.textContent='...';btn.disabled=true;
  clearSearchResults();
  const center = map.getCenter();
  const results = [];
  const needle = q.toLowerCase();
  const hit = (a,b) => (a||'').toLowerCase().includes(needle) || (b||'').toLowerCase().includes(needle);

  // 自分の固定ポイント
  savedPoints.forEach(p=>{
    if(hit(p.name,p.memo)) results.push({ kind:'fixed', name:p.name||'—', memo:p.memo||'', icon:p.icon, ref:p,
      lat:p.lat, lng:p.lng, dist:calcDist(center.lat,center.lng,p.lat,p.lng) });
  });
  // 今のルートのポイント
  points.forEach((p,i)=>{
    if(hit(p.name,p.memo)) results.push({ kind:'route', name:p.name||t('nav_point_default',{n:i+1}), memo:p.memo||'', icon:p.icon||'🛣',
      lat:p.lat, lng:p.lng, dist:calcDist(center.lat,center.lng,p.lat,p.lng) });
  });

  try{
    if(!window.google || !google.maps || !google.maps.places){
      if(!results.length){ alert(t('alert_search_not_ready')); return; }
    } else {
      const { Place } = await google.maps.importLibrary('places');
      const { places } = await Place.searchByText({
        textQuery: q,
        fields: ['displayName','location','formattedAddress'],
        locationBias: { center: { lat: center.lat, lng: center.lng }, radius: 10000 },
        maxResultCount: 10,
        language: PLACES_LANG[currentLang] || 'en'
      });
      (places||[]).forEach(pl=>{
        const lat = pl.location.lat(), lng = pl.location.lng();
        results.push({ kind:'place', name: pl.displayName || q, memo: pl.formattedAddress || '',
          lat, lng, dist: calcDist(center.lat,center.lng,lat,lng) });
      });
    }
  }catch(e){
    console.error(e);
    if(!results.length){ alert(t('alert_search_fail')); return; }
  }finally{
    btn.textContent=t('search_btn');btn.disabled=false;
  }

  if(!results.length){ alert(t('alert_search_notfound')); return; }
  results.sort((a,b)=>a.dist-b.dist);
  searchResults = results;
  renderSearchResults();
  followMode=false;
  document.getElementById('follow-btn').classList.remove('active');
  // 候補が全部入るように地図を広げる（1件だけならその場所へ移動）
  if(results.length===1) setViewVisible([results[0].lat, results[0].lng], 16);
  else map.fitBounds(results.map(r=>[r.lat,r.lng]), {paddingTopLeft:fitPadTL(60), paddingBottomRight:fitPadBR(60), maxZoom:16});
}

function renderSearchResults(){
  const el = document.getElementById('search-results');
  searchMarkers.forEach(m=>map.removeLayer(m));
  searchMarkers = searchResults.map((r,i)=>{
    const m = L.marker([r.lat,r.lng],{icon:makeSearchIcon(r.kind, r.icon), zIndexOffset:500}).addTo(map);
    m.bindTooltip(r.name,{direction:'top',offset:[0,-34]});
    m.on('click', e=>{ L.DomEvent.stopPropagation(e); showSearchPopup(e.latlng, i); });
    return m;

  el.innerHTML = `<div class="sr-head"><span>${t('search_results_title',{n:searchResults.length})}</span>
      <button class="ml-btn" style="padding:2px 8px;" onclick="clearSearchResults()">✕</button></div>` +
    searchResults.map((r,i)=>`<div class="sr-row" style="border-left:3px solid ${SEARCH_COLORS[r.kind]||SEARCH_COLORS.place};">
      <div class="sr-name" onclick="gotoSearchResult(${i})">${

// ===== ナビ =====
const REACH=40;
// ===== 画面が消えないようにする（ナビ中・再生中） =====
let wakeLock = null;

async function requestWakeLock(){
  try{
    if(!('wakeLock' in navigator)) return false;
    if(wakeLock) return true;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    return true;
  }catch(e){
    console.warn('画面のスリープ防止に失敗', e);
    wakeLock = null;
    return false;
  }
}

function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
}

// 他のアプリから戻ってきた時は、解除されているので取り直す
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && (navActive || playRunning)) requestWakeLock();
});

function toggleNav(){navActive?stopNav():startNav();}
function startNav(){
  setTimeout(refreshAdVisibility, 0);
  if(!points.length){alert(t('alert_no_points'));return;}
  navActive=true;navIndex=0;

    if(!ok) console.warn('この端末・ブラウザでは画面のスリープを止められません');
  });
  const btn=document.getElementById('btn-nav');btn.textContent=t('nav_stop_btn');btn.className='btn btn-nav-stop';
  document.getElementById('nav-bar').classList.add('show');
  followMode=true;document.getElementById('follow-btn').classList.add('active');
  refreshAllMarkers();renderList();updateNavBar();
  const p=points[0];
  speak(t('nav_start_speak',{name:p.name||t('nav_point_default',{n:1}),memo:p.memo||''}));

  if(gpsMarker){

    document.getElementById('nav-dist-next').textContent=t('dist_straight',{dist:formatDist(d)});
    const roadRem=calcRemainingDist();
    const totalRem = roadRem!==null ? d+roadRem : d;

  }

function calcDist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
let _cachedVoices = [];
function _refreshVoices(){ _cachedVoices = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : []; }
if('speechSynthesis' in window){
  _refreshVoices();
  speechSynthesis.onvoiceschanged = _refreshVoices;
}
function _findVoiceForLocale(locale){
  if(!_cachedVoices.length) _refreshVoices();
  const exact = _cachedVoices.find(v => v.lang.toLowerCase() === locale.toLowerCase());
  if(exact) return exact;
  const prefix = locale.split('-')[0].toLowerCase();
  return _cachedVoices.find(v => v.lang.toLowerCase().startsWith(prefix)) || null;
}
function speak(txt){
  if(!('speechSynthesis'in window))return;
  const locale = SPEECH_LOCALE[currentLang]||'en-US';
  const voice = _findVoiceForLocale(locale);
  if(!voice){ console.warn('この言語に対応した音声が端末に見つかりません:', locale); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.voice = voice;
  u.lang = voice.lang;
  u.rate=0.95;
  speechSynthesis.speak(u);
}

function reverseRoute(){
  if(points.length<2){alert(t('alert_need_2points'));return;}
  if(!confirm(t('confirm_reverse')))return;
  // 区間の設定（移動手段・色・線の形）を逆順に付け替える
  const segs = points.slice(0, points.length-1).map(p=>({
    segMode: p.segMode, segColor: p.segColor,
    segPath: p.segPath ? p.segPath.slice().reverse() : null
  }));
  points.reverse();
  points.forEach(p=>{ delete p.segMode; delete p.segColor; delete p.segPath; });
  segs.reverse();
  segs.forEach((sg,i)=>{
    if(sg.segMode) points[i].segMode = sg.segMode;
    if(sg.segColor) points[i].segColor = sg.segColor;
    if(sg.segPath) points[i].segPath = sg.segPath;
  });
  if(navActive)navIndex=0;
  rebuildAllMarkers();
  updatePolyline();
  renderList();
  if(navActive)updateNavBar();
}

// ルートポイント → 保存用データ（名前・メモ・アイコン・固定ポイントIDを全部記録）
function pointToSnapshot(p){
  const d = {lat:p.lat, lng:p.lng, name:p.name||'', memo:p.memo||''};
  if(p.icon) d.icon = p.icon;
  if(p.fixedPointId) d.fixedPointId = p.fixedPointId;
  if(p.color) d.color = p.color;
  if(p.segMode) d.segMode = p.segMode;
  if(p.segColor) d.segColor = p.segColor;
  if(p.segStyle) d.segStyle = p.segStyle;
  if(p.segPath && p.segPath.length>1) d.segPath = p.segPath;
  return d;
}
// 保存用データ → ルートポイント（中身は保存時のまま。固定ポイント本体が残っていれば紐付けだけ復活）
function snapshotToPoint(d, i){
  const p = {id:Date.now()+i, lat:d.lat, lng:d.lng, name:d.name||'', memo:d.memo||'', marker:null};
  if(d.color) p.color = d.color;
  if(d.segMode) p.segMode = d.segMode;
  if(d.segColor) p.segColor = d.segColor;
  if(d.segStyle) p.segStyle = d.segStyle;
  if(d.segPath) p.segPath = d.segPath;
  if(d.fixedPointId && savedPoints.some(sp=>sp.id===d.fixedPointId)) p.fixedPointId = d.fixedPointId;
  // アイコン（⭐・🅿など）は、固定ポイントと結びついている時だけ付ける。
  // 結びついていた固定ポイントが削除された時は、普通のルートピンとして表示する
  // （以前は削除後もアイコンだけ残り、固定ポイントに見えるのに固定ポイントではない、という状態になっていた）
  if(d.icon && p.fixedPointId) p.icon = d.icon;
  return p;
}
function saveRoute(){
  if(!points.length){alert(t('alert_no_points'));return;}
  const data={version:3,points:points.map(pointToSnapshot)};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`route-${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function loadRoute(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        clearAll(true);
        data.points.forEach((d,i)=>{
          const p=snapshotToPoint(d,i);
          addMarker(p,i);points.push(p);
        });
        updatePolyline();renderList();
        if(points.length)map.fitBounds(points.map(p=>[p.lat,p.lng]),{padding:[40,40]});
      }catch{alert(t('alert_load_fail'));}
    };
    reader.readAsText(e.target.files[0]);
  };input.click();
}
function clearAll(silent=false){
  if(!silent&&points.length&&!confirm(t('confirm_clear_all')))return;
  points.forEach(p=>{if(p.marker)map.removeLayer(p.marker);});
  points=[];clearPolylines();
  if(navActive)stopNav();
  renderList();
}

// 変換本体：saved_pointsに保存し、同じ順番の位置に固定ポイントとして入れ直す
async function convertRoutePointToFixed(routePointId, name, memo, icon, fpMeta){
  fpMeta = fpMeta || {};
  const idx = points.findIndex(x=>x.id===routePointId);
  if(idx === -1) return true;
  if(!(await ensureSlot('point'))) return false;   // 固定ポイントの上限
  const p = points[idx];
  try{
    const newId = crypto.randomUUID();
    const res = await supabaseFetch('/rest/v1/saved_points', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        id: newId,
        user_id: currentUser.id,
        name, memo, icon, ...fpMeta,
        lat: p.lat, lng: p.lng
      })
    });
    if(res.ok){
      const newSavedPoint = { id:newId, user_id:currentUser.id, name, memo, icon, ...fpMeta, lat:p.lat, lng:p.lng };
      addSavedPointMarker(newSavedPoint);
      if(p.marker) map.removeLayer(p.marker);
      points.splice(idx, 1);
      const savedInsertAfterIndex = insertAfterIndex;
      insertAfterIndex = idx - 1;
      addFixedPointToRoute(newSavedPoint);
      insertAfterIndex = savedInsertAfterIndex;
      return true;
    } else {
      alert(saveFailText(await res.text()));
      return false;
    }
  }catch(e){
    alert(t('err_network'));
    return false;
  }
}

// ===== 距離表示 =====
let distUnit = 'km'; // 'km' or 'mi'
let segmentDistances = []; // ポイント間の道路距離(m)

function toggleDistUnit(){
  distUnit = distUnit==='km' ? 'mi' : 'km';
  document.getElementById('dist-unit-btn').textContent = distUnit;
  updateNavBar();
  renderList();
}

function formatDist(meters){
  if(distUnit==='km'){
    return meters < 1000
      ? Math.round(meters) + 'm'
      : (meters/1000).toFixed(1) + 'km';
  } else {
    const miles = meters / 1609.34;
    return miles < 0.1
      ? Math.round(meters*3.281) + 'ft'
      : miles.toFixed(1) + 'mi';
  }
}

// OSRMレスポンスからセグメント距離を抽出して保存
function storeSegmentDistances(osrmData){
  if(!osrmData || !osrmData.routes || !osrmData.routes[0]) return;
  const legs = osrmData.routes[0].legs;
  segmentDistances = legs.map(l=>l.distance);
}

// 残り距離を計算（navIndex以降のセグメント合計）
function calcRemainingDist(){
  if(!segmentDistances.length) return null;
  let total = 0;
  for(let i=navIndex; i<segmentDistances.length; i++){
    total += segmentDistances[i];
  }
  return total;
}

function checkPasswordRecovery(){
  const hash = window.location.hash;
  if(!hash || !hash.includes('access_token')) return;
  const params = new URLSearchParams(hash.substring(1));
  const accessToken = params.get('access_token');
  const type = params.get('type');
  if(accessToken && type === 'recovery'){
    window._recoveryAccessToken = accessToken;
    // URLからトークンを消す（履歴やリロードに残さないため）
    history.replaceState(null, '', window.location.pathname + window.location.search);
    showSetNewPasswordDialog();

}

let savedPoints = [];
let savedPointMarkers = [];

function addSavedPointMarker(p){
  const icon = L.divIcon({
    html: `<div style="font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.6));">${iconHTML(p.icon||'⭐',26)}</div>`,
    iconSize:[30,30], iconAnchor:[15,26], className:''
  });
  const marker = L.marker([p.lat,p.lng],{icon});
  if(!isPointGroupHidden(p.group_id)) marker.addTo(map);
  if(p.name) marker.bindTooltip(p.name, {direction:'top', offset:[0,-24]});
  marker.on('click', (e)=>{
    if(!addMode){ showInfoPopup(e.latlng || [p.lat,p.lng], p.name, p.memo, {thumb:p.photo_thumb_url, full:p.photo_url}); return; }
    openFixedPointEditModal(p);
  });
  savedPointMarkers.push(marker);
  savedPoints.push(p);
}

function clearSavedPointMarkers(){
  savedPointMarkers.forEach(m=>{ if(map.hasLayer(m)) map.removeLayer(m); });
  savedPointMarkers = [];
  savedPoints = [];
}

async function loadSavedPoints(){
  if(!currentUser) return;
  await loadGroups();
  clearSavedPointMarkers();
  try{
    const res = await supabaseFetch(`/rest/v1/saved_points?user_id=eq.${currentUser.id}`);

    if(Array.isArray(data)) data.forEach(p=>addSavedPointMarker(p));

// ===== 固定ポイントをルートに組み込む（コピーではなく参照。編集は固定ポイント側に反映） =====
function isFixedPointLinked(fpId){
  return points.some(p => p.fixedPointId === fpId);
}

// ルートに組み込まれている間、独立した⭐マーカーは非表示にする（合成マーカーと二重に見えないように）
function refreshSavedPointVisibility(){
  savedPoints.forEach((p, i) => {
    const marker = savedPointMarkers[i];
    if(!marker) return;
    const show = !isFixedPointLinked(p.id) && !isPointGroupHidden(p.group_id);
    if(!show && map.hasLayer(marker)) map.removeLayer(marker);
    else if(show && !map.hasLayer(marker)) marker.addTo(map);
  });
}

function determineFixedInsertPosition(){
  if(insertAfterIndex!==null){
    return insertAfterIndex===-1?0:insertAfterIndex+1;
  }
  return points.length;
}

function addFixedPointToRoute(p){
  const routePoint = { id:Date.now(), lat:p.lat, lng:p.lng, name:p.name, memo:p.memo, marker:null, fixedPointId:p.id, icon:p.icon };
  const insertAt = determineFixedInsertPosition();
  points.splice(insertAt,0,routePoint);
  invalidateSeg(insertAt-1);
  // 前のポイントからこのポイントまでの区間に、選んだ移動手段を使う
  if(modalSegRowActive && insertAt>0 && points[insertAt-1]) points[insertAt-1].segMode = modalSegMode;
  rebuildAllMarkers();
  updatePolyline();
  renderList();
  insertAfterIndex=null;
  document.querySelectorAll('.insert-btn').forEach(b=>b.classList.remove('active'));
}

let usernameCache = {};    // ユーザーID → ユーザー名
let followTab = 'search';
let followSearchResults = [];

  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadFollows(){
  if(!currentUser) return;
  try{
    const res = await supabaseFetch('/rest/v1/follows?select=follower_id,following_id,status');
    if(!res.ok){ console.warn('フォロー読み込み失敗', await res.text()); return; }
    const data = await res.json();
    myFollows = Array.isArray(data) ? data : [];
    const ids = [...new Set(myFollows.flatMap(f=>[f.follower_id, f.following_id]))]
      .filter(id=>id!==currentUser.id && !usernameCache[id]);
    if(ids.length){
      const r2 = await supabaseFetch(`/rest/v1/profiles?select=id,username,avatar_url&id=in.(${ids.join(',')})`);
      if(r2.ok){ (await r2.json()).forEach(p=>{ usernameCache[p.id]=p.username; if(p.avatar_url) avatarCache[p.id]=p.avatar_url; }); }
    }
  }catch(e){
    console.warn('フォロー読み込み失敗', e);
  }
  updateFollowBtn();
  if(document.getElementById('follow-dialog').style.display==='flex') renderFollowList();
}

  const me = currentUser.id;
  return {
    outgoing: myFollows.find(f=>f.follower_id===me && f.following_id===uid) || null,
    incoming: myFollows.find(f=>f.follower_id===uid && f.following_id===me) || null
  };
}

  return `<div class="follow-row"><div class="follow-name" style="display:flex;align-items:center;gap:6px;">${userAvatarHTML(uid,22)}<span style="overflow:hidden;text-overflow:ellipsis;">${fEsc(name)}</span></div>${buttons}</div>`;

function renderFollowList(){
  const el = document.getElementById('follow-list');
  if(!currentUser){ el.innerHTML=''; return; }
  const me = currentUser.id;
  const empty = msg => `<div style="text-align:center;padding:20px;color:#5e5e6b;font-size:12px;">${msg}</div>`;
  let html = '';
  if(followTab==='search'){
    const q = document.getElementById('follow-search-input').value.trim();
    if(!q){ el.innerHTML=''; return; }
    html = followSearchResults.map(p=>followRow(p.id, outgoingButton(p.id))).join('') || empty(t('follow_no_users'));
  } else if(followTab==='following'){
    const list = myFollows.filter(f=>f.follower_id===me && f.status==='accepted');
    html = list.map(f=>followRow(f.following_id, outgoingButton(f.following_id))).join('') || empty(t('follow_empty'));
  } else if(followTab==='followers'){
    const list = myFollows.filter(f=>f.following_id===me && f.status==='accepted');
    html = list.map(f=>followRow(f.follower_id,
      outgoingButton(f.follower_id) +
      `<button class="follow-act danger" onclick="removeFollower('${f.follower_id}')">${t('follow_remove')}</button>`
    )).join('') || empty(t('follow_empty'));
  } else if(followTab==='requests'){
    const list = myFollows.filter(f=>f.following_id===me && f.status==='pending');
    html = list.map(f=>followRow(f.follower_id,
      `<button class="follow-act primary" onclick="approveFollower('${f.follower_id}')">${t('follow_approve')}</button>` +
      `<button class="follow-act danger" onclick="removeFollower('${f.follower_id}',true)">${t('follow_reject')}</button>`
    )).join('') || empty(t('follow_empty'));
  }
  el.innerHTML = html;
}

// ===== Supabase ルート保存・読込 =====
// 更新は同時に1回だけ。同時に何件も期限切れになっても、2件目以降は1件目の結果を待つ
// （同じ更新用の情報で何度も更新しに行くと失敗し、ログアウト扱いになってしまうため）
let refreshInFlight = null;
function refreshAuthToken(){
  if(!refreshInFlight){
    refreshInFlight = refreshAuthTokenOnce().finally(()=>{ refreshInFlight = null; });
  }
  return refreshInFlight;
}
// 通行証（JWT）の有効期限（秒）を読む
function tokenExpiresAt(tok){
  try{
    const part = tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(part)).exp || 0;
  }catch(e){ return 0; }
}
// 期限が切れる2分前になったら、こちらから先に更新しておく（1分ごと・アプリに戻ってきた時に確認）
function refreshIfExpiringSoon(){
  if(!authToken || !refreshToken) return;
  const exp = tokenExpiresAt(authToken);
  if(exp && exp - Date.now()/1000 < 120) refreshAuthToken();
}
setInterval(refreshIfExpiringSoon, 60 * 1000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') refreshIfExpiringSoon(); });

async function refreshAuthTokenOnce(){
  if(!refreshToken){
    // リフレッシュ用の情報を持たない古いセッション（自動更新不能）。
    // 無効なセッションを破棄してログインし直してもらう。
    forceReLogin();
    return false;
  }
  try{
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken })
    });
    if(!res.ok){ forceReLogin(); return false; }
    const data = await res.json();
    if(!data.access_token){ forceReLogin(); return false; }
    authToken = data.access_token;
    refreshToken = data.refresh_token || refreshToken;
    if(data.user) currentUser = { ...currentUser, ...data.user, username: currentUser?.username };
    localStorage.setItem('navi_session', JSON.stringify({ ...data, user: currentUser }));
    return true;
  }catch(e){
    forceReLogin();
    return false;
  }
}

// セッションが自動更新不能な場合、破棄してログイン画面に誘導する
function forceReLogin(){
  currentUser = null;
  authToken = null;
  refreshToken = null;
  localStorage.removeItem('navi_session');
  clearSavedPointMarkers();
  updateUserBar();
  showAuthScreen();
}

async function supabaseFetch(path, options={}, _retried=false){
  const headers = {
    'apikey': SUPABASE_KEY,
    'Content-Type': 'application/json',
  };
  if(options.prefer) headers['Prefer'] = options.prefer;
  if(authToken){
    headers['Authorization'] = 'Bearer ' + authToken;
  } else {
    headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  }
  const res = await fetch(SUPABASE_URL + path, {
    method: options.method || 'GET',
    headers,
    body: options.body
  });
  // JWT期限切れ（401 or PGRST303）なら1回だけ自動更新して再試行
  if((res.status === 401 || res.status === 403) && authToken && !_retried){
    const refreshed = await refreshAuthToken();
    if(refreshed){
      return supabaseFetch(path, options, true);
    }
  }
  return res;
}

function getMlSort(){ let v = 'new'; try{ v = localStorage.getItem(mlSortKey()) || 'new'; }catch(e){} return (v==='near' && mlKind()!=='point') ? 'new' : v; }
let mlActionKey = null;           // 操作ボタンを開いている行（'g:ID' / 'i:ID'）

function visIcon(v){ return v==='public' ? '🌐' : v==='followers' ? '👥' : '🔒'; }

async function loadGroups(){

// 自分か親のどれかが「非表示」なら非表示
function isPointGroupHidden(gid){
  let cur = gid, guard = 0;
  while(cur && guard++ < 100){
    const g = findGroup('point', cur);
    if(!g) return false;
    if(g.is_hidden) return true;
    cur = g.parent_group_id;
  }
  return false;
}

// フォルダを「親→子」の順に並べ、深さ付きで返す（excludeId とその子孫は除く）
function flattenGroups(kind, excludeId){
  const out = [];
  const walk = (parentId, depth) => {
    groupsOf(kind).filter(g=>(g.parent_group_id||null)===parentId)
      .sort((a,b)=>(a.name||'').localeCompare(b.name||''))
      .forEach(g=>{
        if(g.id===excludeId) return;
        out.push({g, depth});
        walk(g.id, depth+1);
      });
  };
  walk(null, 0);
  return out;
}

function descendantGroupIds(kind, id){
  const out = [];
  const walk = pid => groupsOf(kind).filter(g=>g.parent_group_id===pid).forEach(g=>{ out.push(g.id); walk(g.id); });
  walk(id);
  return out;
}

function groupOptionsHTML(kind, selectedId, excludeId){
  let html = `<option value="">${fEsc(t('group_root'))}</option>`;
  flattenGroups(kind, excludeId).forEach(({g, depth})=>{
    html += `<option value="${g.id}"${g.id===selectedId?' selected':''}>${'　'.repeat(depth)}📁 ${fEsc(g.name)}</option>`;
  });
  return html;
}

function fillGroupSelect(sel, kind, selectedId){
  if(selectedId && !findGroup(kind, selectedId)) selectedId = null;
  sel.innerHTML = groupOptionsHTML(kind, selectedId, null);

function fillVisibilitySelect(sel, value){
