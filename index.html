// 並び替えの比べ方（新しい順・古い順・名前順・近い順）
function mlCompare(kind){
  const sort = getMlSort();
  const time = it => it.created_at ? new Date(it.created_at).getTime() : 0;
  const likes = it => it.like_count|0;
  const ord = it => (it.sort_order==null ? 1e9 : it.sort_order);
  if(sort === 'custom')      return (a,b)=> (ord(a) - ord(b)) || (time(b) - time(a));
  if(sort === 'likes_desc')  return (a,b)=> (likes(b) - likes(a)) || (time(b) - time(a));
  if(sort === 'likes_asc')   return (a,b)=> (likes(a) - likes(b)) || (time(b) - time(a));
  if(sort === 'old')  return (a,b)=> time(a) - time(b);
  if(sort === 'name') return (a,b)=> (a.name||'').localeCompare(b.name||'', currentLang||'ja', { numeric:true, sensitivity:'base' });
  if(sort === 'near' && kind === 'point' && gpsMarker){
    const here = gpsMarker.getLatLng();
    const d = it => map.distance(here, [it.lat, it.lng]);
    return (a,b)=> d(a) - d(b);
  }
  return (a,b)=> time(b) - time(a);   // 新しい順
}

function renderMyList(){
  const kind = mlKind();
  const items = kind==='route' ? myRoutes : savedPoints;
  const el = document.getElementById('route-list-items');
  const validGroup = id => id && findGroup(kind, id);
  const cmp = mlCompare(kind);
  updateMlToolbar();
  let html = '';
  const q = mlSearch.trim().toLowerCase();
  if(q){
    // 検索中：フォルダに関係なく、名前が合うものを全部並べる
    items.filter(it=>(it.name||'').toLowerCase().indexOf(q) !== -1).sort(cmp)
      .forEach(it=>{ html += itemRowHTML(kind, it, 0); });
    el.innerHTML = html || `<div style="text-align:center;padding:20px;color:#5e5e6b;font-size:12px;">${t('ml_no_match')}</div>`;
    return;
  }
  const walk = (parentId, depth) => {
    groupsOf(kind).filter(g=>(g.parent_group_id && validGroup(g.parent_group_id) ? g.parent_group_id : null)===parentId)
      .sort(groupCompare())
      .forEach(g=>{
        html += withRowData(groupRowHTML(kind, g, depth), 'g', g.id, parentId);
        if(expandedGroups.has(g.id)) walk(g.id, depth+1);
      });
    items.filter(it=>(validGroup(it.group_id) ? it.group_id : null)===parentId).sort(cmp)
      .forEach(it=>{ html += withRowData(itemRowHTML(kind, it, depth), 'i', it.id, parentId); });
  };
  walk(null, 0);
  el.innerHTML = html || `<div style="text-align:center;padding:20px;color:#5e5e6b;font-size:12px;">${t('no_routes')}</div>`;
}

function groupCompare(){
  const byName = (a,b)=>(a.name||'').localeCompare(b.name||'', currentLang||'ja', { numeric:true, sensitivity:'base' });
  if(getMlSort() !== 'custom') return byName;
  const ord = g => (g.sort_order==null ? 1e9 : g.sort_order);
  return (a,b)=> (ord(a) - ord(b)) || byName(a,b);
}
// 行の先頭のdivに「種類・ID・親フォルダ」を付け、自分の並びの時はドラッグ用の取っ手（≡）を付ける
function withRowData(html, dk, id, parentId){
  const canDrag = getMlSort() === 'custom' && !mlSelectMode && !mlSearch.trim();
  const handle = canDrag
    ? `<span class="ml-drag" onpointerdown="mlDragStart(event,'${dk}','${id}')" title="≡">≡</span>` : '';
  return html.replace('<div class="ml-row"', `<div data-dk="${dk}" data-id="${id}" data-parent="${parentId||''}" class="ml-row"`)
             .replace(/(<div data-dk="[^"]*"[^>]*class="ml-row"[^>]*>)/, `$1${handle}`);
}

// ===== 地図上の写真（サムネ） =====
// ・マップボタン：出さない／ルート上だけ／全部　・到達したら出す（再生・録画・ナビ）
// ・固定ポイントごとに「常に出す」（マイリストの⋯）
// ・保存されている 400px のサムネを画面で縮めて出すだけ（新しいファイルは作らない）
let photoLayer = null, photoSig = '', playReached = -1, playApproach = -1;
const photoMarkers = new Map();   // 地図に出ている写真（キー → マーカー）。出ているものは作り直さない
let previewPhotoMap = {};   // 他人のルートを見る時：固定ポイントID → 写真
let previewVisibleFixed = new Set();   // 他人のルートの中で、自分が見てよい固定ポイントのID（非公開のものは入らない）
let previewFixedRows = {};             // その固定ポイントの中身（写真など）
function photoMapMode(){ try{ return localStorage.getItem('photo_map_mode') || 'off'; }catch(e){ return 'off'; } }
function photoOnReach(){ try{ return localStorage.getItem('photo_on_reach') === '1'; }catch(e){ return false; } }
function setPhotoMapMode(v){ try{ localStorage.setItem('photo_map_mode', v); }catch(e){} renderPhotoBadges(true); }
function setPhotoOnReach(on){
  try{ localStorage.setItem('photo_on_reach', on ? '1' : '0'); }catch(e){}
  syncPhotoControls(); renderPhotoBadges(true);
}
function syncPhotoControls(){
  const a = document.getElementById('photo-map-mode'); if(a) a.value = photoMapMode();
  const b = document.getElementById('photo-on-reach'); if(b) b.checked = photoOnReach();
  const c = document.getElementById('play-photo-reach'); if(c) c.checked = photoOnReach();
}
// ルートのポイントの写真（固定ポイントと結びついている時）
function routePointPhoto(p){
  if(!p.fixedPointId) return null;
  const sp = savedPoints.find(x=>x.id===p.fixedPointId);
  if(sp && sp.photo_thumb_url) return { thumb:sp.photo_thumb_url, full:sp.photo_url, name:sp.name, memo:sp.memo, pinned:!!sp.photo_pinned };
  const pv = previewPhotoMap[p.fixedPointId];
  return pv ? { thumb:pv.thumb, full:pv.full, name:p.name, memo:p.memo, pinned:false } : null;
}
function photoBadgeMarker(ll, ph, liftPx){
  const icon = L.divIcon({ html:`<div class="photo-badge"><img src="${ph.thumb}" loading="lazy" alt=""></div>`,
    iconSize:[48,48], iconAnchor:[24, 48 + liftPx], className:'' });
  const m = L.marker(ll, { icon, interactive:true, zIndexOffset:500 });
  m.on('click', e=>{ L.DomEvent.stopPropagation(e); showInfoPopup(ll, ph.name||'', ph.memo||'', { thumb:ph.thumb, full:ph.full }); });
  return m;
}
// 今の状態から、出す写真を決めて地図に置く（状態が変わった時だけ作り直す）
function renderPhotoBadges(force){
  if(typeof map === 'undefined' || !map || typeof L === 'undefined') return;
  const mode = photoMapMode(), reachOn = photoOnReach();
  const playing = !!playLayer, naving = !!navActive;
  let reachIdx = -1;
  if(playing) reachIdx = playApproach;
  else if(naving){
    reachIdx = navIndex - 1;
    // ナビ：次の目的地まで150m以内に近づいたら、その写真も出す
    const nx = points[navIndex];
    if(nx && gpsMarker && map.distance(gpsMarker.getLatLng(), [nx.lat, nx.lng]) < 150) reachIdx = navIndex;
  }
  const list = [];
  // ① 今のルートのポイント
  points.forEach((p, idx)=>{
    const ph = routePointPhoto(p); if(!ph) return;
    let show;
    if((playing || naving) && reachOn) show = idx <= reachIdx;
    else show = mode === 'route' || mode === 'all' || ph.pinned;
    if(show) list.push({ ll:[p.lat,p.lng], ph, lift:40, key:'r'+idx+ph.thumb });
  });
  // ② 自分の固定ポイント（地図に⭐で出ているもの）
  savedPoints.forEach((sp, i)=>{
    if(!sp.photo_thumb_url) return;
    const mk = savedPointMarkers[i]; if(!mk || !map.hasLayer(mk)) return;
    if(mode === 'all' || sp.photo_pinned)
      list.push({ ll:[sp.lat,sp.lng], ph:{ thumb:sp.photo_thumb_url, full:sp.photo_url, name:sp.name, memo:sp.memo }, lift:28, key:'s'+sp.id+sp.photo_thumb_url });
  });
  // ③ 他人のルート・固定ポイントを見ている時
  if(previewState && previewLayer){
    if(previewState.kind === 'point'){
      if(mode === 'all') previewState.items.forEach(p=>{ if(p.photo_thumb_url) list.push({ ll:[p.lat,p.lng], ph:{ thumb:p.photo_thumb_url, full:p.photo_url, name:p.name, memo:p.memo }, lift:30, key:'pp'+p.id }); });
    } else if(mode === 'route' || mode === 'all'){
      previewState.items.forEach(r=>(r.points||[]).forEach((d,i)=>{
        const pv = d.fixedPointId && previewPhotoMap[d.fixedPointId];
        if(pv) list.push({ ll:[d.lat,d.lng], ph:{ thumb:pv.thumb, full:pv.full, name:d.name, memo:d.memo }, lift:40, key:'pr'+r.id+i });
      }));
    }
  }
  const sig = list.map(x=>x.key+'@'+x.ll.join(',')).join('|');
  if(!force && sig === photoSig) return;
  photoSig = sig;
  if(!photoLayer) photoLayer = L.layerGroup().addTo(map);
  const want = new Map(list.map(x=>[x.key+'@'+x.ll.join(','), x]));
  for(const [k, m] of photoMarkers){ if(!want.has(k)){ photoLayer.removeLayer(m); photoMarkers.delete(k); } }
  for(const [k, x] of want){
    if(photoMarkers.has(k)) continue;   // もう出ている写真は触らない（出直しのアニメーションを起こさない）
    const m = photoBadgeMarker(x.ll, x.ph, x.lift);
    photoLayer.addLayer(m); photoMarkers.set(k, m);
  }
}
// 状態の変化（ルートの読み込み・再生・ナビの進み具合など）に合わせて、軽く見張って更新する
setInterval(()=>renderPhotoBadges(false), 400);
// 他人のルートを見る時：結びついている固定ポイントの写真を取ってくる（見られる範囲のものだけ）
async function loadPreviewPhotos(items){
  previewPhotoMap = {}; previewVisibleFixed = new Set(); previewFixedRows = {};
  const ids = [...new Set(items.flatMap(r=>(r.points||[]).map(d=>d.fixedPointId).filter(Boolean)))];
  if(!ids.length) return;
  try{
    // 見る権限がある固定ポイントだけが返ってくる（非公開・見られない公開範囲のものは返ってこない）
    const res = await supabaseFetch(`/rest/v1/saved_points?id=in.(${ids.join(',')})&select=id,photo_url,photo_thumb_url`);
    const rows = res.ok ? await res.json() : [];
    rows.forEach(r=>{
      previewVisibleFixed.add(r.id);
      previewFixedRows[r.id] = r;
      if(r.photo_thumb_url) previewPhotoMap[r.id] = { thumb:r.photo_thumb_url, full:r.photo_url };
    });
  }catch(e){}
  renderPhotoBadges(true);
}
// 他人のルートのポイントが「見てよい固定ポイント」か
function previewFixedVisible(d){ return !!(d.fixedPointId && previewVisibleFixed.has(d.fixedPointId)); }
// 固定ポイントの写真を「常に地図に出す」の切り替え
async function togglePhotoPinned(id){
  const sp = savedPoints.find(x=>x.id===id); if(!sp) return;
  if(await mlWrite(`/rest/v1/saved_points?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ photo_pinned: !sp.photo_pinned }) })){
    await afterMlChange();
    renderPhotoBadges(true);
  }
}

// ===== ドラッグで並び替え・フォルダへ入れる（並び替えが「自分の並び」の時だけ） =====
// ・フォルダの行の真ん中に落とす → そのフォルダの中へ
// ・行の上側／下側に落とす → その前／後ろへ（同じ親の中で並び替え。親が違えばその親へ移動）
let mlDrag = null;
function mlDragStart(ev, dk, id){
  ev.preventDefault(); ev.stopPropagation();
  const row = ev.target.closest('.ml-row'); if(!row) return;
  const list = document.getElementById('route-list-items');
  const name = (row.querySelector('.ml-name')||row).textContent.trim().split('\n')[0];
  const ghost = document.createElement('div'); ghost.id = 'ml-drag-ghost'; ghost.textContent = name;
  document.body.appendChild(ghost);
  row.classList.add('ml-dragging');
  mlDrag = { dk, id, parent: row.dataset.parent || '', row, ghost, list, target:null, mode:null, scrollTimer:null };
  mlDragMove(ev);
  document.addEventListener('pointermove', mlDragMove, { passive:false });
  document.addEventListener('pointerup', mlDragEnd);
  document.addEventListener('pointercancel', mlDragCancel);
}
function mlClearDropMarks(){
  document.querySelectorAll('#route-list-items .ml-drop-into, #route-list-items .ml-drop-before, #route-list-items .ml-drop-after')
    .forEach(el=>el.classList.remove('ml-drop-into','ml-drop-before','ml-drop-after'));
}
function mlDragMove(ev){
  if(!mlDrag) return;
  if(ev.cancelable) ev.preventDefault();
  mlDrag.ghost.style.left = (ev.clientX + 12) + 'px';
  mlDrag.ghost.style.top  = (ev.clientY - 14) + 'px';
  // 一覧の上下の端に近づいたら自動でスクロール
  const r = mlDrag.list.getBoundingClientRect();
  clearInterval(mlDrag.scrollTimer);
  const edge = 40;
  if(ev.clientY < r.top + edge) mlDrag.scrollTimer = setInterval(()=>{ mlDrag && (mlDrag.list.scrollTop -= 12); }, 30);
  else if(ev.clientY > r.bottom - edge) mlDrag.scrollTimer = setInterval(()=>{ mlDrag && (mlDrag.list.scrollTop += 12); }, 30);
  mlClearDropMarks();
  mlDrag.target = null; mlDrag.mode = null;
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const row = el && el.closest ? el.closest('#route-list-items .ml-row[data-dk]') : null;
  if(!row || row === mlDrag.row) return;
  const box = row.getBoundingClientRect();
  const y = (ev.clientY - box.top) / box.height;
  let mode;
  if(row.dataset.dk === 'g' && y > 0.28 && y < 0.72) mode = 'into';
  else mode = y < 0.5 ? 'before' : 'after';
  // フォルダを自分の中（子孫）には入れられない
  if(mlDrag.dk === 'g'){
    const kind = mlKind();
    const bad = new Set([mlDrag.id, ...descendantGroupIds(kind, mlDrag.id)]);
    const destParent = mode === 'into' ? row.dataset.id : (row.dataset.parent || '');
    if(bad.has(destParent) || (row.dataset.dk === 'g' && bad.has(row.dataset.id) && mode === 'into')) return;
  }
  row.classList.add(mode === 'into' ? 'ml-drop-into' : mode === 'before' ? 'ml-drop-before' : 'ml-drop-after');
  mlDrag.target = row; mlDrag.mode = mode;
}
function mlDragCleanup(){
  if(!mlDrag) return;
  clearInterval(mlDrag.scrollTimer);
  mlDrag.ghost.remove();
  mlDrag.row.classList.remove('ml-dragging');
  mlClearDropMarks();
  document.removeEventListener('pointermove', mlDragMove);
  document.removeEventListener('pointerup', mlDragEnd);
  document.removeEventListener('pointercancel', mlDragCancel);
}
function mlDragCancel(){ mlDragCleanup(); mlDrag = null; }
async function mlDragEnd(){
  const d = mlDrag; mlDragCleanup(); mlDrag = null;
  if(!d || !d.target) return;
  const kind = mlKind();
  const tgt = d.target, mode = d.mode;
  const tbl = d.dk === 'g' ? groupTable(kind) : itemTable(kind);
  const parentCol = d.dk === 'g' ? 'parent_group_id' : 'group_id';
  // 落とした先の親フォルダ
  const destParent = mode === 'into' ? tgt.dataset.id : (tgt.dataset.parent || '');
  // 同じ親の中の、同じ種類（フォルダ同士／中身同士）の並び
  const all = d.dk === 'g' ? groupsOf(kind) : (kind === 'route' ? myRoutes : savedPoints);
  const valid = id => id && findGroup(kind, id);
  const parentOf = x => d.dk === 'g' ? (valid(x.parent_group_id) ? x.parent_group_id : '') : (valid(x.group_id) ? x.group_id : '');
  const siblings = all.filter(x => parentOf(x) === destParent && x.id !== d.id)
                      .sort(d.dk === 'g' ? groupCompare() : mlCompare(kind));
  let idx = siblings.length;   // 既定は最後
  if(mode !== 'into' && tgt.dataset.dk === d.dk){
    const ti = siblings.findIndex(x => x.id === tgt.dataset.id);
    if(ti !== -1) idx = mode === 'before' ? ti : ti + 1;
  } else if(mode !== 'into' && d.dk === 'i' && tgt.dataset.dk === 'g'){
    idx = 0;   // フォルダの行の近くに落とした中身は、その階層の中身の先頭へ
  }
  const moved = all.find(x => x.id === d.id); if(!moved) return;
  const order = siblings.slice(); order.splice(idx, 0, moved);
  // 変わったものだけ書き込む（並び順は 10 刻み）
  const writes = [];
  order.forEach((x, i) => {
    const want = (i + 1) * 10;
    const body = {};
    if(x.sort_order !== want) body.sort_order = want;
    if(x.id === d.id && parentOf(x) !== destParent) body[parentCol] = destParent || null;
    if(Object.keys(body).length) writes.push(supabaseFetch(`/rest/v1/${tbl}?id=eq.${x.id}`, { method:'PATCH', prefer:'return=minimal', body: JSON.stringify(body) }));
  });
  if(!writes.length) return;
  try{
    const res = await Promise.all(writes);
    const bad = res.find(r => !r.ok);
    if(bad){ alert(saveFailText(await bad.text())); }
  }catch(e){ alert(t('err_network')); }
  await afterMlChange();   // 開閉状態はそのまま
}

// リンクで開かれた時：中身を読み込んでプレビュー表示
async function openSharedLink(){
  const q = new URLSearchParams(location.search);
  const pairs = [['r','route','item'],['p','point','item'],['rg','route','group'],['pg','point','group']];
  for(const [param, kind, type] of pairs){
    const id = q.get(param);
    if(!id) continue;
    try{
      if(type==='item'){
        const path = kind==='route'
          ? `/rest/v1/routes?id=eq.${id}&select=id,user_id,name,points,visibility,group_id,like_count,created_at`
          : `/rest/v1/saved_points?id=eq.${id}`;
        const res = await supabaseFetch(path);
        const data = res.ok ? await res.json() : [];
        if(!data.length){ alert(t('link_not_visible')); return; }
        const it = data[0];
        await cacheUsernames([it.user_id]);
        evKind = kind; evUserId = it.user_id; evData = { groups:[], items:[it] };
        startPreview({ kind, type:'item', ownerId:it.user_id, title:it.name, icon:it.icon, visibility:it.visibility, groups:[], items:[it] });
      } else {
        const gt = kind==='route' ? 'route_groups' : 'point_groups';
        const res = await supabaseFetch(`/rest/v1/${gt}?id=eq.${id}`);
        const data = res.ok ? await res.json() : [];
        if(!data.length){ alert(t('link_not_visible')); return; }
        const owner = data[0].user_id;
        await cacheUsernames([owner]);
        evKind = kind;
        await openEvUser(owner);
        closeRouteList();
        if(!evFindGroup(id)){ alert(t('link_not_visible')); return; }
        previewEvGroup(id);
      }
    }catch(e){
      alert(t('link_not_visible'));
    }
    return;
  }
}

async function cacheUsernames(ids){
  const need = [...new Set(ids)].filter(id=>id && !usernameCache[id]);
  if(!need.length) return;
  try{
    const res = await supabaseFetch(`/rest/v1/profiles?select=id,username,avatar_url&id=in.(${need.join(',')})`);
    if(res.ok) (await res.json()).forEach(p=>{ usernameCache[p.id]=p.username; if(p.avatar_url) avatarCache[p.id]=p.avatar_url; });
  }catch(e){}
}

const PHOTO_BUCKET = 'point-photos';
let pendingPhoto = null;      // これから保存する写真 {thumb, full}
let currentPhoto = { thumb:null, full:null };  // 今モーダルで表示している写真のURL

// 写真を縮めてWebPにする
async function makePhotoBlob(file, size, quality){
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, size / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  return await new Promise(r=>canvas.toBlob(r, 'image/webp', quality)) || file;
}

async function onPointPhotoPicked(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  try{
    const thumb = await makePhotoBlob(file, 400, 0.8);
    const full  = await makePhotoBlob(file, 1200, 0.82);   // 容量を抑えるため全員1200pxに統一
    pendingPhoto = { thumb, full };
    const url = URL.createObjectURL(thumb);

async function uploadPhotoFile(pointId, blob, suffix){
  const path = `${currentUser.id}/${pointId}-${suffix}.webp`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${PHOTO_BUCKET}/${path}`, {
    method:'POST',
    headers:{ 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + (authToken || SUPABASE_KEY), 'x-upsert':'true', 'Content-Type':'image/webp' },
    body: blob
  });
  if(!res.ok) throw new Error(await res.text());
  return `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${path}?t=${Date.now()}`;
}

// この地点に、自分がアップした写真ファイルが既にあるか（あれば差し替えなので枠は増えない）
// ※「写真を外す」を押すと currentPhoto は空になるので、開いた時の写真（originalPhotoFull）で判定する
function hasOwnPhotoFile(pointId){
  const url = originalPhotoFull || currentPhoto.full;
  return !!(currentUser && url && url.indexOf(`/${PHOTO_BUCKET}/${currentUser.id}/${pointId}-f.webp`) !== -1);
}
let photoDeleteAfterSave = null;   // 保存が成功したら消す写真ファイルの地点ID

// 保存時に写真をアップロードし、固定ポイントに入れる中身を返す（中止する時は {__cancel:true}）
async function buildPhotoFields(pointId){
  photoDeleteAfterSave = null;
  if(!canUsePhoto() || document.getElementById('fp-photo-row').style.display==='none') return {};
  if(pendingPhoto === 'remove'){
    if(hasOwnPhotoFile(pointId)) photoDeleteAfterSave = pointId;
    return { photo_url:null, photo_thumb_url:null };
  }
  if(!pendingPhoto) return {};
  // 新しい写真（差し替えでない）なら、上限を確認（無料10枚＋増枠／有料1日30枚）
  if(!hasOwnPhotoFile(pointId) && !(await ensureSlot('photo'))) return { __cancel:true };
  try{
    // 本体を先、サムネを後（サーバー側で「サムネは本体の枚数まで」と確認しているため）
    const isNew = !hasOwnPhotoFile(pointId);
    const full  = await uploadPhotoFile(pointId, pendingPhoto.full, 'f');
    const thumb = await uploadPhotoFile(pointId, pendingPhoto.thumb, 't');
    lastNewPhotoPointId = isNew ? pointId : null;
    return { photo_thumb_url: thumb, photo_url: full };
  }catch(e){
    console.warn('写真のアップロード失敗', e);
    alert(t('quota_photo_blocked'));
    return { __cancel:true };
  }
}

  if(!currentUser || !pointId) return;

// 画像を正方形に収めて縮小する。色が変わらないようPNG（可逆）で書き出す
async function processImage(file, size){
  // 小さい画像はそのまま使う（変換しないので、色も透過も元のまま）
  if(file.size <= 400*1024) return file;
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const scale = Math.min(size / bitmap.width, size / bitmap.height);
  const w = bitmap.width * scale, h = bitmap.height * scale;
  ctx.drawImage(bitmap, (size-w)/2, (size-h)/2, w, h); // 背景は塗らない＝透過のまま
  const blob = await new Promise(r=>canvas.toBlob(r, 'image/png'));
  return blob || file;
}

function blobToDataURL(blob){
  return new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(fr.result); fr.readAsDataURL(blob); });
}

function evFindGroup(id){ return evData.groups.find(g=>g.id===id) || null; }

// 見えているフォルダの親を返す（親が見えていなければ一番上扱い）
function evParentOf(g){ return (g.parent_group_id && evFindGroup(g.parent_group_id)) ? g.parent_group_id : null; }
function evGroupOfItem(it){ return (it.group_id && evFindGroup(it.group_id)) ? it.group_id : null; }

function renderEveryoneTree(){
  const el = document.getElementById('route-list-items');
  let html = `<div class="ml-row"><button class="ml-btn" onclick="evBack()">${t('ev_back')}</button>
    <div class="ml-name" style="display:flex;align-items:center;gap:6px;">${userAvatarHTML(evUserId,22)}<span style="overflow:hidden;text-overflow:ellipsis;">${fEsc(usernameCache[evUserId]||'—')} · ${evKind==='route'?t('tab_routes'):t('tab_points')}</span></div></div>`;
  const walk = (parentId, depth) => {
    evData.groups.filter(g=>evParentOf(g)===parentId).sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(g=>{
      const open = evExpanded.has(g.id);
      html += `<div class="ml-row" style="padding-left:${depth*16+4}px;">
        <button class="ml-toggle" onclick="evToggle('${g.id}')">${open?'▼':'▶'}</button>

        <span class="ml-vis" title="${fEsc(visLabel(g.visibility))}">${visIcon(g.visibility)}</span>
      </div>`;
      if(open) walk(g.id, depth+1);
    });
    evData.items.filter(it=>evGroupOfItem(it)===parentId).forEach(it=>{
      const label = evKind==='route'
        ? `🛣 ${fEsc(it.name)} <span class="ml-sub">· ${t('points_count',{n:(it.points||[]).length})}</span>`
        : `<span style="display:inline-flex;vertical-align:middle;">${iconHTML(it.icon,18)}</span> ${fEsc(it.name||'—')}`;
      html += `<div class="ml-row" style="padding-left:${depth*16+26}px;">
        <div class="ml-name" onclick="previewEvItem('${it.id}')">${label}</div>
        <span class="ml-vis" title="${fEsc(visLabel(it.visibility))}">${visIcon(it.visibility)}</span>
        ${likeBtnHTML(evKind, it.id, it.like_count)}
      </div>`;
    });
  };
  walk(null, 0);
  if(!evData.groups.length && !evData.items.length){
    html += `<div style="text-align:center;padding:20px;color:#5e5e6b;font-size:12px;">${t('no_routes')}</div>`;
  }
  el.innerHTML = html;
}

// フォルダとその子孫（見えているもの）を「親→子」の順に
function evSubtreeGroups(rootId){
  const out = [];
  const g0 = evFindGroup(rootId); if(!g0) return out;
  out.push(g0);
  const walk = pid => evData.groups.filter(g=>g.parent_group_id===pid).forEach(g=>{ out.push(g); walk(g.id); });
  walk(rootId);
  return out;
}

// 全部入る大きさで、全ポイントの中心に一番近いポイントを中心にする
function fitPointsAroundCenter(latlngs){
  if(!latlngs.length) return;
  if(latlngs.length===1){ setViewVisible(latlngs[0], Math.max(map.getZoom(),16)); return; }
  const b = L.latLngBounds(latlngs);
  const c = b.getCenter();
  let best = latlngs[0], bestD = Infinity;
  latlngs.forEach(ll=>{ const d = calcDist(c.lat,c.lng,ll[0],ll[1]); if(d<bestD){ bestD=d; best=ll; } });
  let dLat = 0, dLng = 0;
  latlngs.forEach(ll=>{ dLat=Math.max(dLat,Math.abs(ll[0]-best[0])); dLng=Math.max(dLng,Math.abs(ll[1]-best[1])); });
  map.fitBounds([[best[0]-dLat,best[1]-dLng],[best[0]+dLat,best[1]+dLng]], {paddingTopLeft:fitPadTL(), paddingBottomRight:fitPadBR()});
}

async function drawPreviewRoute(route){
  const pts = (route.points||[]);
  pts.forEach((d,i)=>{
    // 見られない（非公開などの）固定ポイントは、固定ポイントのアイコンを付けず普通のルートピンにする
    L.marker([d.lat,d.lng],{icon:makePreviewPin(i+1, previewFixedVisible(d) ? d.icon : null)}).bindPopup(pointPopupHTML(d.name,d.memo)).addTo(previewLayer);
  });
  if(pts.length<2) return;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const mode = a.segMode || 'car';
    if(a.segPath && a.segPath.length>1 && mode!=='straight'){
      L.polyline(a.segPath, {color:'#45c7ff', weight:5, opacity:0.85,
        dashArray:(mode==='train'||mode==='plane')?'12,8':null}).addTo(previewLayer);
      continue;
    }
    const straight = segIsStraight(mode);
    const tmp = L.polyline([[a.lat,a.lng],[b.lat,b.lng]],
      {color:'#45c7ff', weight: straight?4:3, opacity: straight?0.85:0.5,
       dashArray: (mode==='train'||mode==='plane') ? '12,8' : '6,6'}).addTo(previewLayer);
    if(straight) continue;
    try{
      const r = await fetchSegmentGeometry(a,b,mode);
      if(previewLayer && previewLayer.hasLayer(tmp)){
        previewLayer.removeLayer(tmp);
        L.geoJSON(r.geometry,{style:{color:'#45c7ff',weight:5,opacity:0.85}}).addTo(previewLayer);
      }
    }catch(e){ /* 直線のまま */ }
  }
}

// ===== 同じ場所の重複チェック =====
const DUP_RADIUS_M = 30; // これより近ければ「同じ場所」とみなす

// 自分の固定ポイントの中から、同じ場所にあるものを探す
function findNearbyOwnPoint(lat, lng){
  let best = null, bestD = DUP_RADIUS_M;
  savedPoints.forEach(p=>{
    const d = calcDist(lat, lng, p.lat, p.lng);
    if(d <= bestD){ bestD = d; best = p; }
  });
  return best;
}

function dupChoice(title, bodyHTML, buttons){
  return new Promise(resolve=>{
    const dlg = document.getElementById('dup-dialog');
    document.getElementById('dup-title').textContent = title;
    document.getElementById('dup-body').innerHTML = bodyHTML;
    const box = document.getElementById('dup-buttons');
    box.innerHTML = '';
    buttons.forEach(b=>{
      const el = document.createElement('button');
      el.textContent = b.label;
      el.style.cssText = `padding:11px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid ${b.primary?'#ff9f1c':'#343b48'};background:${b.primary?'#ff9f1c':'#181b23'};color:${b.primary?'#000':'#ddd'};`;
      el.onclick = ()=>{ dlg.style.display='none'; resolve(b.value); };
      box.appendChild(el);
    });
    dlg.style.display = 'flex';
  });
}

function dupLine(label, p){
  return `<div style="padding:6px 0;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:11px;color:#777;width:46px;flex-shrink:0;">${label}</span>
      <span style="display:inline-flex;">${iconHTML(p.icon,18)}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${fEsc(p.name||'—')}</span>
    </div>
    <div style="margin-left:54px;font-size:12px;color:#9a9aa6;white-space:pre-wrap;word-break:break-word;max-height:80px;overflow-y:auto;">${p.memo ? fEsc(p.memo) : `<span style="color:#5e5e6b;">${t('dup_no_memo')}</span>`}</div>
    ${p.photo_thumb_url ? `<img src="${p.photo_thumb_url}" style="margin:6px 0 0 54px;max-width:120px;border-radius:6px;display:block;">` : ''}
  </div>`;
}

// 重複した分をどうするか決める。戻り値：元ID → 'new'（両方残す）/ 'overwrite'（上書き）/ 'keep'（自分のを残す）
async function resolveDuplicates(conflicts){
  if(!conflicts.length) return {};
  const out = {};
  const mode = await dupChoice(
    t('dup_title'),
    `<div style="margin-bottom:8px;">${t('dup_msg',{n:conflicts.length})}</div>` +
      conflicts.slice(0,2).map(c=>dupLine(t('dup_mine'), c.mine) + dupLine(t('dup_theirs'), c.src)).join('<hr style="border:none;border-top:1px solid #262b36;margin:6px 0;">') +
      (conflicts.length>2 ? `<div style="color:#777;font-size:11px;margin-top:6px;">…</div>` : ''),
    [
      { label: t('dup_overwrite_all'), value:'overwrite' },
      { label: t('dup_keep_all'), value:'keep' },
      { label: t('dup_one_by_one'), value:'each' },
      { label: t('cancel_btn'), value:'cancel' }
    ]
  );
  if(mode==='cancel') return null;
  if(mode!=='each'){ conflicts.forEach(c=>{ out[c.src.id] = mode; }); return out; }
  for(const c of conflicts){
    const v = await dupChoice(
      t('dup_title'),
      dupLine(t('dup_mine'), c.mine) + dupLine(t('dup_theirs'), c.src),
      [
        { label: t('dup_use_theirs'), value:'overwrite', primary:true },
        { label: t('dup_keep_mine'), value:'keep' },
        { label: t('dup_keep_both'), value:'new' },
        { label: t('cancel_btn'), value:'cancel' }
      ]
    );
    if(v==='cancel') return null;
    out[c.src.id] = v;
  }
  return out;
}

// 上書き：自分の固定ポイントの名前・メモ・アイコンを相手のもので置き換える
async function overwriteOwnPoint(mineId, src){
  const res = await supabaseFetch(`/rest/v1/saved_points?id=eq.${mineId}`, {
    method:'PATCH', prefer:'return=minimal',
    body: JSON.stringify({ name: src.name||'', memo: src.memo||'', icon: src.icon||'⭐', source_point_id: src.id,
      photo_url: src.photo_url || null, photo_thumb_url: src.photo_thumb_url || null })
  });
  if(!res.ok) throw new Error(await res.text());
  if(src.photo_url) deleteOwnPhotoFiles(mineId);   // 自分の写真は相手の写真に置き換わったので消す
}

// ===== 保存（コピーは必ず🔒非公開。元を記録して、2回目は足りない分だけ追加） =====
async function insertRows(table, rows){
  if(!rows.length) return;
  const res = await supabaseFetch(`/rest/v1/${table}`, { method:'POST', prefer:'return=minimal', body: JSON.stringify(rows) });
  if(!res.ok) throw new Error(await res.text());
}

// フォルダ構造をコピー。既に同じ元からコピー済みのフォルダは使い回す。戻り値：元ID → 自分のID
async function copyGroupTree(kind, srcGroups, destId){
  const map_ = {};
  const rows = [];
  const mine = groupsOf(kind);
  srcGroups.forEach((g, i)=>{
    const existing = mine.find(x=>x.source_group_id===g.id);
    if(existing){ map_[g.id] = existing.id; return; }
    const parent = i===0 ? (destId||null) : (map_[g.parent_group_id] || destId || null);
    const id = crypto.randomUUID();
    map_[g.id] = id;
    rows.push({ id, user_id: currentUser.id, name: g.name, parent_group_id: parent, visibility:'private', source_group_id: g.id });
  });
  await insertRows(groupTable(kind), rows);
  return map_;
}

async function savePreview(){
  if(!previewState) return;
  if(!currentUser){ showAuthScreen(); return; }
  const st = previewState;
  const btn = document.getElementById('pv-save-btn');
  btn.disabled = true;
  const destId = document.getElementById('pv-dest').value || null;
  if(st.kind==='route') lastRouteGroupId = destId; else lastPointGroupId = destId;
  let added = 0, skipped = 0, overwritten = 0;
  let showRouteId = null;   // コピー後に地図に出すルート
  try{
    await loadGroups();
    const gmap = st.type==='group' ? await copyGroupTree(st.kind, st.groups, destId) : {};
    const groupFor = it => st.type==='group' ? (gmap[it.group_id] || destId) : destId;

    if(st.kind==='point'){
      const fresh = [], conflicts = [];
      st.items.forEach(p=>{
        if(savedPoints.some(x=>x.source_point_id===p.id)){ skipped++; return; }
        const near = findNearbyOwnPoint(p.lat, p.lng);
        if(near) conflicts.push({ src:p, mine:near });
        else fresh.push(p);
      });
      const decisions = await resolveDuplicates(conflicts);
      if(decisions===null){ btn.disabled=false; return; }
      const rows = fresh.map(p=>({ id: crypto.randomUUID(), user_id: currentUser.id, name: p.name, memo: p.memo, icon: p.icon||'⭐',
        lat: p.lat, lng: p.lng, group_id: groupFor(p), visibility:'private', is_public:false, source_point_id: p.id,
        photo_url: p.photo_url||null, photo_thumb_url: p.photo_thumb_url||null }));
      for(const c of conflicts){
        const d = decisions[c.src.id];
        if(d==='overwrite'){ await overwriteOwnPoint(c.mine.id, c.src); overwritten++; }
        else if(d==='keep'){ skipped++; }
        else rows.push({ id: crypto.randomUUID(), user_id: currentUser.id, name: c.src.name, memo: c.src.memo, icon: c.src.icon||'⭐',
          lat: c.src.lat, lng: c.src.lng, group_id: groupFor(c.src), visibility:'private', is_public:false, source_point_id: c.src.id,
          photo_url: c.src.photo_url||null, photo_thumb_url: c.src.photo_thumb_url||null });
      }
      await insertRows('saved_points', rows);
      added = rows.length;
    } else {
      const r0 = await supabaseFetch(`/rest/v1/routes?user_id=eq.${currentUser.id}&select=source_route_id`);
      const haveRoutes = new Set((r0.ok ? await r0.json() : []).map(x=>x.source_route_id).filter(Boolean));
      const includePts = document.getElementById('pv-include-row').style.display!=='none'
        && document.getElementById('pv-include-points').checked;
      // ルートの中の固定ポイント：元ID → 自分の固定ポイントID
      const fpMap = {};
      const fpRows = [];
      const targets = st.items.filter(r=>{ if(haveRoutes.has(r.id)){ skipped++; return false; } return true; });
      if(includePts){
        const cand = [], conflicts = [];
        targets.forEach(r=>(r.points||[]).forEach(d=>{
          if(!previewFixedVisible(d) || fpMap[d.fixedPointId]) return;   // 見られない固定ポイントは、普通のルートピンとして保存
          const existing = savedPoints.find(x=>x.source_point_id===d.fixedPointId || x.id===d.fixedPointId);
          if(existing){ fpMap[d.fixedPointId] = existing.id; return; }
          fpMap[d.fixedPointId] = null; // 一度見たという印
          const near = findNearbyOwnPoint(d.lat, d.lng);
          const src = { id:d.fixedPointId, name:d.name||'', memo:d.memo||'', icon:d.icon||'⭐', lat:d.lat, lng:d.lng };
          if(near) conflicts.push({ src, mine:near });
          else cand.push(src);
        }));
        const decisions = await resolveDuplicates(conflicts);
        if(decisions===null){ btn.disabled=false; return; }
        cand.forEach(src=>{
          const id = crypto.randomUUID();
          fpMap[src.id] = id;
          const fr = previewFixedRows[src.id] || {};
          fpRows.push({ id, user_id: currentUser.id, name: src.name, memo: src.memo, icon: src.icon,
            lat: src.lat, lng: src.lng, group_id: null, visibility:'private', is_public:false, source_point_id: src.id,
            photo_url: fr.photo_url || null, photo_thumb_url: fr.photo_thumb_url || null });
        });
        for(const c of conflicts){
          const d = decisions[c.src.id];
          if(d==='overwrite'){ await overwriteOwnPoint(c.mine.id, c.src); overwritten++; fpMap[c.src.id] = c.mine.id; }
          else if(d==='keep'){ fpMap[c.src.id] = c.mine.id; }
          else {
            const id = crypto.randomUUID();
            fpMap[c.src.id] = id;
            fpRows.push({ id, user_id: currentUser.id, name: c.src.name, memo: c.src.memo, icon: c.src.icon,
              lat: c.src.lat, lng: c.src.lng, group_id: null, visibility:'private', is_public:false, source_point_id: c.src.id });
          }
        }
        // 固定ポイントの空きを先に確認（足りないと全部まとめて保存に失敗するため）
        if(fpRows.length){
          const q = await quotaStatus();
          if(q && q.logged_in && !q.premium){
            const room = Math.max(0, q.points_limit - q.points_used) + (q.point_credits|0);
            if(fpRows.length > room){
              if(!confirm(t('pv_points_no_room', { n: fpRows.length, m: room }))){ btn.disabled = false; return; }
              // ルートだけ保存：新しく作る予定だった固定ポイントは作らず、普通のルートピンにする
              fpRows.forEach(r=>{ Object.keys(fpMap).forEach(k=>{ if(fpMap[k] === r.id) fpMap[k] = null; }); });
              fpRows.length = 0;
            }
          }
        }
        await insertRows('saved_points', fpRows);
      }
      const rows = targets.map(r=>({
        id: crypto.randomUUID(), user_id: currentUser.id, name: r.name, group_id: groupFor(r), visibility:'private', is_public:false, source_route_id: r.id,
        points: (r.points||[]).map(d=>{
          const c = { lat:d.lat, lng:d.lng, name:d.name||'', memo:d.memo||'' };
          if(d.color) c.color = d.color;
          if(d.segMode) c.segMode = d.segMode;
          if(d.segColor) c.segColor = d.segColor;
          if(d.segStyle) c.segStyle = d.segStyle;
          if(d.segPath) c.segPath = d.segPath;
          if(includePts && d.fixedPointId && fpMap[d.fixedPointId]){
            c.fixedPointId = fpMap[d.fixedPointId];
            if(d.icon) c.icon = d.icon;
          }
          // 固定ポイントをコピーしない時は、アイコン（⭐など）も付けない＝普通のルートピンにする
          return c;
        })
      }));
      await insertRows('routes', rows);
      added = rows.length;
      // コピーしたルートを地図に出したままにする（フォルダごとの時は最初のルート）
      if(rows.length) showRouteId = rows[0].id;
      else if(st.items.length){
        // 全部コピー済みだった時は、前にコピーした最初のルートを出す
        const r1 = await supabaseFetch(`/rest/v1/routes?user_id=eq.${currentUser.id}&source_route_id=eq.${st.items[0].id}&select=id&limit=1`);
        const got = r1.ok ? await r1.json() : [];
        if(got.length) showRouteId = got[0].id;
      }
    }
    await loadSavedPoints();
    alert(t('preview_result',{n:added, m:skipped}) + (overwritten ? ' ' + t('dup_result',{k:overwritten}) : ''));
    cancelPreview();
    if(showRouteId) await loadFromSupabase(showRouteId, true);
  }catch(e){
    if(String(e.message).indexOf('POINT_LIMIT') !== -1) alert(t('quota_point_limit_bulk'));
    else alert(t('alert_save_fail',{err: e.message}));
  }finally{
    btn.disabled = false;
  }
}

async function loadFromSupabase(id, silent){
  try {
    const res = await supabaseFetch(`/rest/v1/routes?id=eq.${id}`);
    const data = await res.json();
    if(!data.length){ alert(t('alert_route_notfound')); return; }
    const route = data[0];
    clearAll(true);
    route.points.forEach((d,i)=>{
      const p=snapshotToPoint(d,i);
      addMarker(p,i); points.push(p);
    });
    updatePolyline(); renderList();
    if(points.length) map.fitBounds(points.map(p=>[p.lat,p.lng]),{padding:[40,40]});
    closeRouteList();
    if(!silent) alert(t('alert_load_success',{name:route.name}));
  } catch(e){
    alert(t('alert_load_route_fail',{err:e.message}));
  }
}

// リワード動画：最後まで見たら true、途中で閉じたら false、読み込めなければ null
function showRewardedAd(){
  const am = admob(); if(!am || !admobReady) return Promise.resolve(null);
  return new Promise(async resolve=>{
    let got = false, done = false;
    const hs = [];
    const finish = v=>{ if(done) return; done = true; hs.forEach(h=>{ try{ h && h.remove && h.remove(); }catch(e){} }); resolve(v); };
    try{
      hs.push(await am.addListener('onRewardedVideoAdReward', ()=>{ got = true; }));
      hs.push(await am.addListener('onRewardedVideoAdDismissed', ()=>finish(got)));
      hs.push(await am.addListener('onRewardedVideoAdFailedToShow', ()=>finish(null)));
      await am.prepareRewardVideoAd({ adId:ADMOB_IDS.reward, isTesting:ADMOB_TESTING });
      am.showRewardVideoAd().catch(()=>{});   // 見終わった時だけ返ってくるので、終了は上のイベントで判定
    }catch(e){ console.warn('リワード動画の読み込み失敗', e); finish(null); }

    am.addListener('interstitialAdDismissed', ()=>{ admobInterLoaded = false; prepareInterstitial(); });
    am.addListener('interstitialAdFailedToShow', ()=>{ admobInterLoaded = false; });
    admobReady = true;
    refreshAdMobBanner();
    prepareInterstitial();
  }catch(e){ console.warn('AdMob初期化失敗', e); }
}

// バナー：ナビ中・再生モード中（録画モード含む）・有料会員は出さない
function admobBannerShouldShow(){
  if(isPremium()) return false;
  if(typeof navActive !== 'undefined' && navActive) return false;
  if(document.getElementById('play-bar').classList.contains('show')) return false;
  return true;
}
async function refreshAdMobBanner(){
  const am = admob(); if(!am || !admobReady) return;
  const show = admobBannerShouldShow();
  try{
    if(show && !admobBannerShown){
      admobBannerShown = true;
      if(!admobBannerMade){
        admobBannerMade = true;
        await am.showBanner({ adId:ADMOB_IDS.banner, adSize:'ADAPTIVE_BANNER', position:'TOP_CENTER', margin:0, isTesting:ADMOB_TESTING });
      } else {
        await am.resumeBanner();
      }
    } else if(!show && admobBannerShown){
      admobBannerShown = false;
      setAdShift(0);
      await am.hideBanner();
    }
  }catch(e){ console.warn('バナー表示失敗', e); }
}

// 全画面広告：先に読み込んでおき、再生モードを閉じた時に出す
async function prepareInterstitial(){
  const am = admob(); if(!am || !admobReady || admobInterLoaded || isPremium()) return;
  try{ await am.prepareInterstitial({ adId:ADMOB_IDS.interstitial, isTesting:ADMOB_TESTING }); admobInterLoaded = true; }
  catch(e){ console.warn('全画面広告の読み込み失敗', e); }
}
async function maybeShowInterstitial(){
  const am = admob(); if(!am || !admobReady || isPremium()) return;
  let last = 0; try{ last = parseInt(localStorage.getItem('admob_inter_last') || '0', 10) || 0; }catch(e){}
  if(Date.now() - last < INTERSTITIAL_GAP_MS) return;
  if(!admobInterLoaded){ prepareInterstitial(); return; }
  try{
    admobInterLoaded = false;
    try{ localStorage.setItem('admob_inter_last', String(Date.now())); }catch(e){}
    await am.showInterstitial();
  }catch(e){ console.warn('全画面広告の表示失敗', e); prepareInterstitial(); }
}

// 保存失敗のメッセージ（上限に当たった時は分かりやすい案内に置き換える）
let lastNewPhotoPointId = null;   // 直前に「新しい写真」をアップした地点（保存に失敗したらファイルを消す）
function saveFailText(txt){
  if(/JWT expired|PGRST303|PGRST301/.test(String(txt))) return t('session_expired');
  if(String(txt).indexOf('PHOTO_LIMIT') !== -1){
    if(lastNewPhotoPointId){ deleteOwnPhotoFiles(lastNewPhotoPointId); lastNewPhotoPointId = null; }
    return t('quota_photo_blocked');
  }
  if(String(txt).indexOf('POINT_LIMIT') !== -1) return t('quota_point_limit_bulk');
  return t('alert_save_fail',{err: txt});
}

// ===== 無料の上限（固定ポイント30個・写真10枚）とリワードでの増枠 =====
async function quotaStatus(){
  if(!currentUser || !authToken) return null;
  try{
    const res = await supabaseFetch('/rest/v1/rpc/quota_status', { method:'POST', body:'{}' });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function grantBonus(kind){
  try{
    const res = await supabaseFetch('/rest/v1/rpc/grant_bonus', { method:'POST', body: JSON.stringify({ p_kind: kind }) });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
// もう1つ追加できるか確認。上限ならアプリはリワード動画で増枠、Webは案内を出す
async function ensureSlot(kind){
  const st = await quotaStatus();
  if(!st || !st.logged_in) return true;   // 確認できない時はサーバー側の判定に任せる
  premiumFlag = !!st.premium;
  if(st.premium){
    if(kind === 'photo' && st.photos_today >= st.photo_daily_limit){ alert(t('quota_photo_daily')); return false; }
    return true;
  }
  const used  = kind === 'point' ? st.points_used  : st.photos_used;
  const limit = kind === 'point' ? st.points_limit : st.photos_limit;     // 基本の上限（写真10・固定ポイント30）
  const credits = kind === 'point' ? (st.point_credits|0) : (st.photo_credits|0);   // 使っていない追加券
  if(used < limit) return true;
  if(kind === 'photo' && used >= (st.photo_max || 50)){ alert(t('quota_photo_max')); return false; }   // 無料は最大50枚
  if(credits > 0) return true;   // 追加券を1枚使って追加（実際に使うのはサーバー側）
  if(!(isNativeApp() && admob())){
    alert(t(kind === 'point' ? 'quota_point_limit_web' : 'quota_photo_limit_web', { limit }));
    return false;
  }
  if((st.bonus_left|0) <= 0){ alert(t('quota_bonus_used_up')); return false; }
  if(!confirm(t(kind === 'point' ? 'quota_point_limit_app' : 'quota_photo_limit_app', { limit, n: st.bonus_left }))) return false;
  const got = await showRewardedAd();
  if(got === null){ alert(t('rec_reward_load_fail')); return false; }
  if(!got){ alert(t('quota_reward_not_done')); return false; }
  const g = await grantBonus(kind);
  if(!g || !g.ok){
    alert(g && g.reason === 'daily' ? t('quota_bonus_used_up') : g && g.reason === 'max' ? t('quota_photo_max') : t('err_network'));
    return false;
  }
  alert(t(kind === 'point' ? 'quota_bonus_added_point' : 'quota_bonus_added_photo', { n: g.credits }));
  return true;
}

// ✕：再生モードを閉じる → 無料ならタイミングを見て全画面広告
function closePlayback(){

function adShouldShow(){

// ===== パネルの開け閉め =====
// 3段階：full（メニュー＋ルートリスト）→ list（ルートリストだけ）→ hidden（隠す）
const PANEL_STATES = ['full','list','hidden'];
let panelState = 'full';

function isLandscapePanel(){
  return window.matchMedia('(orientation:landscape) and (max-width:1024px)').matches;
}

function setPanelState(state){
  if(!PANEL_STATES.includes(state)) return;
  panelState = state;
  document.body.classList.toggle('panel-list', state==='list');
  document.body.classList.toggle('panel-hidden', state==='hidden');
  updatePanelLabels();
  updatePanelMetrics();
  if(window.map) setTimeout(()=>{ map.invalidateSize(); updatePanelMetrics(); }, 260);
}

// パネルの大きさを測って、地図上のボタンが隠れないようにする
function updatePanelMetrics(){
  const panel = document.getElementById('bottom');
  const edge = document.getElementById('panel-edge');
  const hidden = panelState==='hidden';
  const land = isLandscapePanel();
  const st = document.documentElement.style;
  st.setProperty('--panel-h', (!hidden && !land) ? panel.offsetHeight + 'px' : '0px');
  st.setProperty('--panel-w', (!hidden && land) ? panel.offsetWidth + 'px' : '0px');
  // パネルを隠している時に出る端のバーの分
  const rec = document.body.classList.contains('rec-mode');
  st.setProperty('--edge-h', (hidden && !land && !rec) ? edge.offsetHeight + 'px' : '0px');
  st.setProperty('--edge-w', (hidden && land && !rec) ? edge.offsetWidth + 'px' : '0px');
  const zc = document.querySelector('.leaflet-top.leaflet-right');
  if(zc) zc.style.marginRight = `calc(var(--panel-w, 0px) + var(--edge-w, 0px))`;
}

function updatePanelLabels(){
  const land = isLandscapePanel();
  const txt = document.getElementById('panel-handle-text');
  const arrows = document.querySelectorAll('#panel-handle .ph-arrow');
  const edge = document.getElementById('panel-edge-text');
  if(txt){
    txt.textContent = panelState==='full' ? t('panel_list_only') : t('panel_close');
  }
  arrows.forEach(a=>{ a.textContent = land ? '▶' : '▼'; });
  if(edge) edge.textContent = (land ? '◀ ' : '▲ ') + t('panel_open') + (land ? ' ◀' : ' ▲');
}

// 一段階しまう／出す
function panelStepDown(){
  const i = PANEL_STATES.indexOf(panelState);
  setPanelState(PANEL_STATES[Math.min(i+1, PANEL_STATES.length-1)]);
}
function panelStepUp(){
  const i = PANEL_STATES.indexOf(panelState);
  setPanelState(PANEL_STATES[Math.max(i-1, 0)]);
}

// 以前の呼び出し名（互換のため残す）
function togglePanelHidden(){ setPanelState(panelState==='hidden' ? 'full' : 'hidden'); }
function togglePanelListOnly(){ setPanelState(panelState==='list' ? 'full' : 'list'); }

// ハンドルとバーの操作（タップ＋スワイプ）
(function(){
  const handle = document.getElementById('panel-handle');
  const edge = document.getElementById('panel-edge');

  function attach(el, onTap, onAway, onBack){
    let x0=null, y0=null, moved=false;
    el.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; moved=false; }, {passive:true});
    el.addEventListener('touchmove', ()=>{ moved=true; }, {passive:true});
    el.addEventListener('touchend', e=>{
      if(x0===null) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      x0=null;
      const land = isLandscapePanel();
      const away = land ? dx : dy;      // 横向きは右へ、縦向きは下へ＝しまう
      const cross = land ? dy : dx;
      // 指で操作した時は、この後にブラウザが自動で出す「クリック」を止める。
      // 止めないと、①同じタップがもう一度処理される ②パネルが動いた後、指の下に来たボタン
      // （ログイン・フォロー・マイリスト等）が押されたことになる（ゴーストクリック）
      e.preventDefault();
      if(Math.abs(away) > 40 && Math.abs(away) > Math.abs(cross)){
        if(away > 0) onAway(); else onBack();
      } else if(!moved){
        onTap();
      }
    }, {passive:false});
    el.addEventListener('click', e=>{ if(e.detail) onTap(); });
  }

  attach(handle, ()=>panelStepDown(), ()=>panelStepDown(), ()=>panelStepUp());
  attach(edge, ()=>setPanelState('full'), ()=>{}, ()=>setPanelState('full'));
})();

window.addEventListener('resize', ()=>{ updatePanelLabels(); updatePanelMetrics(); });

window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(window.map) map.invalidateSize(); }, 300); });
window.addEventListener('resize', ()=>{ if(window.map) map.invalidateSize(); });

applyStaticTranslations();

// ===== 初めての人向けの案内（最初の1回だけ。4枚） =====
const ONBOARD_ICONS = ['📍','🧭','📁','🎬'];
let onboardStep = 0;
function renderOnboard(){
  const i = onboardStep;
  document.getElementById('ob-icon').textContent = ONBOARD_ICONS[i];
  document.getElementById('ob-title').textContent = t('ob_title' + (i+1));
  document.getElementById('ob-body').textContent = t('ob_body' + (i+1));
  document.getElementById('ob-dots').innerHTML = ONBOARD_ICONS.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('');
  document.getElementById('ob-next').textContent = t(i === ONBOARD_ICONS.length-1 ? 'ob_start' : 'ob_next');
  document.getElementById('ob-skip').textContent = t('ob_skip');
  document.getElementById('ob-guide').textContent = t('ob_guide');
}
function showOnboard(){ onboardStep = 0; renderOnboard(); document.getElementById('onboard').style.display = 'flex'; }
function nextOnboard(){
  if(onboardStep < ONBOARD_ICONS.length-1){ onboardStep++; renderOnboard(); }
  else closeOnboard();
}
function closeOnboard(){
  document.getElementById('onboard').style.display = 'none';
  try{ localStorage.setItem('onboarded_v1', '1'); }catch(e){}
}
(function(){
  let done = false;
  try{ done = localStorage.getItem('onboarded_v1') === '1'; }catch(e){}
  if(done) return;
  // 共有リンクから来た人は、まず中身を見てもらう（案内は出さない）
  if(/[?&](r|p|rg|pg)=/.test(location.search)) return;
  setTimeout(showOnboard, isNativeApp() ? 1700 : 400);   // アプリはロゴ画面の後
})();

syncPhotoControls();

    navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW登録失敗', e));

}
